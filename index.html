<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Shadow Chat Daanians</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --blue:#168ce8;
  --blue2:#eaf6ff;
  --dark:#17212b;
  --text:#17212b;
  --muted:#718096;
  --border:#e4eaf0;
  --white:#fff;
  --danger:#e74c3c;
  --green:#20b26b;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f9fc;
  color:var(--text);
}

button,input,textarea{
  font:inherit;
}

button{
  cursor:pointer;
  border:0;
}

.hidden{
  display:none!important;
}

/* AUTH */

#authScreen{
  width:100%;
  height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at top left,#dff3ff,transparent 40%),
    radial-gradient(circle at bottom right,#e9f7ff,transparent 40%),
    #f7fbfe;
}

.auth-card{
  width:420px;
  max-width:100%;
  background:white;
  border:1px solid var(--border);
  border-radius:24px;
  padding:30px;
  box-shadow:0 20px 60px rgba(30,80,120,.12);
}

.logo-large{
  width:72px;
  height:72px;
  border-radius:22px;
  background:var(--blue);
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 15px;
  box-shadow:0 10px 25px rgba(22,140,232,.25);
}

.logo-large svg{
  width:55px;
  height:55px;
}

.auth-title{
  text-align:center;
  font-size:27px;
  font-weight:800;
}

.auth-sub{
  text-align:center;
  color:var(--muted);
  margin:7px 0 25px;
  font-size:14px;
}

.auth-input{
  width:100%;
  height:48px;
  border:1px solid var(--border);
  border-radius:12px;
  padding:0 14px;
  outline:none;
  margin-bottom:11px;
  background:#fbfdff;
}

.auth-input:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(22,140,232,.08);
}

.primary-btn{
  width:100%;
  height:48px;
  border-radius:12px;
  background:var(--blue);
  color:white;
  font-weight:700;
  margin-top:5px;
}

.secondary-btn{
  width:100%;
  height:46px;
  border-radius:12px;
  background:#eef7fd;
  color:var(--blue);
  font-weight:700;
  margin-top:10px;
}

.auth-switch{
  text-align:center;
  margin-top:17px;
  font-size:13px;
  color:var(--muted);
}

.auth-switch span{
  color:var(--blue);
  cursor:pointer;
  font-weight:700;
}

.auth-error{
  color:#d93025;
  background:#fff1f0;
  border-radius:10px;
  padding:10px;
  margin-bottom:12px;
  font-size:13px;
  display:none;
}

/* APP */

#app{
  width:100%;
  height:100dvh;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:64px;
  flex:none;
  background:white;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  z-index:50;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.brand-logo{
  width:40px;
  height:40px;
  border-radius:12px;
  background:var(--blue);
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
}

.brand-logo svg{
  width:31px;
  height:31px;
}

.brand-name{
  font-size:18px;
  font-weight:800;
  white-space:nowrap;
}

.top-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.icon-btn{
  width:40px;
  height:40px;
  border-radius:12px;
  background:#f1f7fb;
  color:#4a6578;
  font-size:19px;
  position:relative;
}

.icon-btn:hover{
  background:#e5f3fd;
  color:var(--blue);
}

.notify-dot{
  position:absolute;
  right:7px;
  top:6px;
  width:8px;
  height:8px;
  background:#ff3b30;
  border-radius:50%;
  display:none;
}

.layout{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:270px minmax(0,1fr) 290px;
}

/* LEFT */

.sidebar{
  background:white;
  border-right:1px solid var(--border);
  min-width:0;
  overflow:auto;
}

.sidebar-title{
  padding:18px 16px 10px;
  font-size:13px;
  color:var(--muted);
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.5px;
}

.nav-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 15px;
  margin:3px 8px;
  border-radius:12px;
  color:#526575;
  font-weight:600;
}

.nav-item:hover,
.nav-item.active{
  background:#eaf6ff;
  color:var(--blue);
}

.friend-list{
  padding:0 8px 20px;
}

.friend{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  border-radius:13px;
  cursor:pointer;
}

.friend:hover{
  background:#f1f8fd;
}

.friend-info{
  min-width:0;
  flex:1;
}

.friend-name{
  font-weight:700;
  font-size:14px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.friend-user{
  color:var(--muted);
  font-size:11px;
  margin-top:2px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.online-dot{
  width:8px;
  height:8px;
  background:var(--green);
  border-radius:50%;
  flex:none;
}

/* AVATAR */

.avatar{
  border-radius:50%;
  overflow:hidden;
  background:linear-gradient(135deg,#d9efff,#8dcef7);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-weight:800;
  flex:none;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.avatar.small{
  width:38px;
  height:38px;
  font-size:13px;
}

.avatar.medium{
  width:44px;
  height:44px;
  font-size:14px;
}

.avatar.big{
  width:90px;
  height:90px;
  font-size:27px;
}

/* CENTER */

.center{
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  background:#f7fafc;
}

.chat-head{
  height:68px;
  flex:none;
  background:white;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:11px;
  padding:0 17px;
}

.chat-head-info{
  min-width:0;
  flex:1;
}

.chat-head-name{
  font-weight:800;
  font-size:15px;
}

.chat-head-status{
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
}

.messages{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:18px;
}

.msg{
  display:flex;
  gap:9px;
  margin-bottom:14px;
  max-width:78%;
}

.msg.mine{
  margin-left:auto;
  flex-direction:row-reverse;
}

.msg-content{
  min-width:0;
}

.bubble{
  background:white;
  border:1px solid var(--border);
  border-radius:15px;
  padding:9px 12px;
  line-height:1.45;
  font-size:14px;
  word-break:break-word;
  box-shadow:0 2px 7px rgba(0,0,0,.025);
}

.msg.mine .bubble{
  background:#168ce8;
  color:white;
  border-color:#168ce8;
}

.msg-time{
  font-size:9px;
  color:#9aa8b4;
  margin-top:4px;
}

.msg.mine .msg-time{
  text-align:right;
}

.unsent-message{
  border:1px solid #dfe6ec;
  background:#f7f9fb;
  color:#8a97a2;
  border-radius:14px;
  padding:9px 12px;
  font-style:italic;
}

.unsent-message strong{
  color:#71808d;
  margin-right:4px;
}

.composer{
  flex:none;
  background:white;
  border-top:1px solid var(--border);
  padding:10px;
  display:flex;
  gap:8px;
}

.message-input{
  flex:1;
  min-width:0;
  height:44px;
  border:1px solid var(--border);
  border-radius:14px;
  padding:0 14px;
  outline:none;
}

.message-input:focus{
  border-color:var(--blue);
}

.send-btn{
  width:46px;
  height:44px;
  border-radius:14px;
  background:var(--blue);
  color:white;
  font-size:18px;
}

/* RIGHT */

.rightbar{
  background:white;
  border-left:1px solid var(--border);
  min-width:0;
  overflow:auto;
}

.right-title{
  padding:18px;
  font-size:15px;
  font-weight:800;
  border-bottom:1px solid var(--border);
}

.requests{
  padding:10px;
}

.request{
  padding:12px;
  border-bottom:1px solid #f0f3f5;
}

.request-top{
  display:flex;
  align-items:center;
  gap:9px;
}

.request-info{
  flex:1;
  min-width:0;
}

.request-name{
  font-weight:700;
  font-size:13px;
}

.request-user{
  color:var(--muted);
  font-size:11px;
}

.request-actions{
  display:flex;
  gap:6px;
  margin-top:9px;
}

.accept-btn,
.reject-btn{
  flex:1;
  height:32px;
  border-radius:8px;
  font-size:11px;
  font-weight:700;
}

.accept-btn{
  background:#e8f8f0;
  color:#15925a;
}

.reject-btn{
  background:#fff0ef;
  color:#d94b40;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(12,25,35,.38);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:200;
  backdrop-filter:blur(5px);
}

.modal-card{
  width:430px;
  max-width:100%;
  max-height:90dvh;
  overflow:auto;
  background:white;
  border-radius:22px;
  box-shadow:0 25px 70px rgba(0,0,0,.2);
  padding:22px;
}

.modal-close{
  float:right;
  width:34px;
  height:34px;
  border-radius:10px;
  background:#f1f5f8;
}

.profile-box{
  text-align:center;
  padding:10px;
}

.profile-name{
  font-size:21px;
  font-weight:800;
  margin-top:10px;
}

.profile-username{
  color:var(--blue);
  font-size:13px;
  margin-top:4px;
}

.profile-bio{
  color:#657583;
  margin:12px 0;
  font-size:13px;
}

.profile-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.profile-action{
  min-height:42px;
  border-radius:11px;
  background:#eef7fd;
  color:var(--blue);
  font-weight:700;
}

.profile-action.danger{
  background:#fff0ef;
  color:#d94b40;
}

.profile-action.green{
  background:#e9f8f1;
  color:#15925a;
}

/* NOTIFICATION */

.notification-panel{
  position:fixed;
  top:70px;
  right:15px;
  width:330px;
  max-width:calc(100vw - 30px);
  max-height:70vh;
  overflow:auto;
  background:white;
  border:1px solid var(--border);
  border-radius:17px;
  box-shadow:0 18px 50px rgba(0,0,0,.16);
  z-index:150;
}

.notification-title{
  padding:13px 15px;
  font-weight:800;
  border-bottom:1px solid var(--border);
}

.notification{
  padding:12px;
  display:flex;
  gap:9px;
  border-bottom:1px solid #f0f3f5;
  cursor:pointer;
}

.notification:hover{
  background:#f5faff;
}

.notification-text{
  font-size:12px;
  line-height:1.4;
}

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%) translateY(20px);
  background:#17212b;
  color:white;
  padding:11px 16px;
  border-radius:12px;
  font-size:12px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:500;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* CALL */

.call-modal{
  text-align:center;
}

.call-avatar{
  margin:15px auto;
}

.call-name{
  font-size:22px;
  font-weight:800;
}

.call-status{
  color:var(--muted);
  margin:6px 0 20px;
}

.call-buttons{
  display:flex;
  justify-content:center;
  gap:12px;
}

.call-btn{
  width:55px;
  height:55px;
  border-radius:50%;
  font-size:20px;
}

.call-end{
  background:#ffebe9;
  color:#df4438;
}

.call-accept{
  background:#e9f8f0;
  color:#15925a;
}

#remoteVideo{
  width:100%;
  max-height:400px;
  border-radius:15px;
  background:#101820;
  object-fit:cover;
}

#localVideo{
  width:120px;
  height:90px;
  border-radius:12px;
  object-fit:cover;
  background:#111;
  position:absolute;
  right:25px;
  bottom:100px;
  border:2px solid white;
}

/* MOBILE NAV */

.mobile-nav{
  display:none;
}

/* RESPONSIVE
   Keep same PC-style structure.
*/

@media(max-width:1050px){
  .layout{
    grid-template-columns:230px minmax(0,1fr) 240px;
  }

  .brand-name{
    font-size:16px;
  }
}

@media(max-width:800px){
  .layout{
    grid-template-columns:210px minmax(0,1fr);
  }

  .rightbar{
    display:none;
  }

  .mobile-nav{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    height:58px;
    flex:none;
    background:white;
    border-top:1px solid var(--border);
    z-index:60;
  }

  .mobile-nav button{
    background:white;
    color:#607180;
    font-size:12px;
    font-weight:700;
  }

  .mobile-nav button.active{
    color:var(--blue);
    background:#f0f8fe;
  }

  .sidebar.mobile-show{
    display:block!important;
    position:fixed;
    top:64px;
    left:0;
    bottom:58px;
    width:min(320px,88vw);
    z-index:100;
    box-shadow:10px 0 30px rgba(0,0,0,.12);
  }

  .rightbar.mobile-show{
    display:block!important;
    position:fixed;
    top:64px;
    right:0;
    bottom:58px;
    width:min(340px,92vw);
    z-index:100;
    box-shadow:-10px 0 30px rgba(0,0,0,.12);
  }
}

@media(max-width:560px){
  .topbar{
    height:58px;
    padding:0 9px;
  }

  .brand-logo{
    width:36px;
    height:36px;
  }

  .brand-name{
    font-size:14px;
  }

  .top-actions .icon-btn{
    width:36px;
    height:36px;
  }

  .layout{
    grid-template-columns:minmax(0,1fr);
    height:calc(100dvh - 58px - 58px);
  }

  .sidebar{
    display:none;
  }

  .center{
    width:100%;
    height:100%;
  }

  .chat-head{
    height:60px;
    padding:0 10px;
  }

  .messages{
    padding:12px 9px;
  }

  .msg{
    max-width:90%;
  }

  .bubble{
    font-size:13px;
  }

  .composer{
    padding:7px;
  }

  .message-input{
    height:42px;
  }

  .send-btn{
    height:42px;
    width:44px;
  }

  .modal{
    padding:10px;
  }

  .modal-card{
    border-radius:18px;
    padding:18px;
  }
}

@media(min-width:801px){
  .mobile-nav{
    display:none!important;
  }
}
</style>
</head>

<body>

<!-- AUTH -->
<div id="authScreen">

  <div class="auth-card">

    <div class="logo-large">
      <svg viewBox="0 0 100 100">
        <path d="M20 46C20 25 35 12 50 12C67 12 80 26 80 46V78C80 83 75 86 71 82L63 75L55 83L47 75L39 83L31 75L23 82C19 85 20 77 20 78Z" fill="white"/>
        <circle cx="39" cy="45" r="6" fill="#168ce8"/>
        <circle cx="61" cy="45" r="6" fill="#168ce8"/>
        <path d="M34 58C40 68 60 68 66 58C57 62 43 62 34 58Z" fill="#168ce8"/>
        <path d="M38 58L43 61M62 58L57 61" stroke="#168ce8" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="auth-title">Shadow Chat Daanians</div>
    <div class="auth-sub">Private • Real-time • Anonymous</div>

    <div id="authError" class="auth-error"></div>

    <div id="loginBox">

      <input id="loginEmail"
             class="auth-input"
             type="email"
             placeholder="Email">

      <input id="loginPassword"
             class="auth-input"
             type="password"
             placeholder="Password">

      <button class="primary-btn" onclick="loginUser()">
        Login
      </button>

      <button class="secondary-btn" onclick="anonymousLogin()">
        Continue as Anonymous
      </button>

      <div class="auth-switch">
        Don't have an account?
        <span onclick="showSignup()">Create Account</span>
      </div>

    </div>

    <div id="signupBox" class="hidden">

      <input id="signupEmail"
             class="auth-input"
             type="email"
             placeholder="Email">

      <input id="signupPassword"
             class="auth-input"
             type="password"
             placeholder="Password">

      <input id="signupUsername"
             class="auth-input"
             type="text"
             placeholder="Username">

      <input id="signupDisplay"
             class="auth-input"
             type="text"
             placeholder="Display Name">

      <button class="primary-btn" onclick="signupUser()">
        Create Account
      </button>

      <div class="auth-switch">
        Already have an account?
        <span onclick="showLogin()">Login</span>
      </div>

    </div>

  </div>
</div>


<!-- APP -->
<div id="app" class="hidden">

  <header class="topbar">

    <div class="brand">

      <div class="brand-logo">
        <svg viewBox="0 0 100 100">
          <path d="M20 46C20 25 35 12 50 12C67 12 80 26 80 46V78C80 83 75 86 71 82L63 75L55 83L47 75L39 83L31 75L23 82C19 85 20 77 20 78Z" fill="white"/>
          <circle cx="39" cy="45" r="6" fill="#168ce8"/>
          <circle cx="61" cy="45" r="6" fill="#168ce8"/>
          <path d="M34 58C40 68 60 68 66 58C57 62 43 62 34 58Z" fill="#168ce8"/>
          <path d="M38 58L43 61M62 58L57 61" stroke="#168ce8" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </div>

      <div class="brand-name">
        Shadow Chat Daanians
      </div>

    </div>

    <div class="top-actions">

      <button class="icon-btn"
              title="Notifications"
              onclick="toggleNotifications()">
        🔔
        <span id="notifyDot" class="notify-dot"></span>
      </button>

      <button class="icon-btn"
              title="My Profile"
              onclick="openOwnProfile()">
        👤
      </button>

      <button class="icon-btn"
              title="Logout"
              onclick="logoutUser()">
        ⎋
      </button>

    </div>

  </header>


  <div class="layout">

    <!-- LEFT FRIENDS -->
    <aside id="sidebar" class="sidebar">

      <div class="sidebar-title">
        Chats
      </div>

      <div class="nav-item active"
           onclick="openPublicChat()">
        💬
        Public Chat
      </div>

      <div class="sidebar-title">
        Friends
      </div>

      <div id="friendList" class="friend-list">
        <div style="padding:15px;color:#8795a1;font-size:12px;">
          Loading friends...
        </div>
      </div>

    </aside>


    <!-- CENTER CHAT -->
    <main class="center">

      <div class="chat-head">

        <div id="chatHeadAvatar"
             class="avatar medium">
          👻
        </div>

        <div class="chat-head-info">

          <div id="chatHeadName"
               class="chat-head-name">
            Public Chat
          </div>

          <div id="chatHeadStatus"
               class="chat-head-status">
            Everyone
          </div>

        </div>

        <button id="chatHeadProfileBtn"
                class="icon-btn hidden"
                onclick="openCurrentFriendProfile()">
          👤
        </button>

        <button id="chatHeadCallBtn"
                class="icon-btn hidden"
                onclick="startVoiceCall()">
          📞
        </button>

        <button id="chatHeadVideoBtn"
                class="icon-btn hidden"
                onclick="startVideoCall()">
          🎥
        </button>

      </div>


      <div id="messages"
           class="messages">
      </div>


      <div class="composer">

        <input id="messageInput"
               class="message-input"
               type="text"
               autocomplete="off"
               placeholder="Write a message..."
               onkeydown="handleMessageKey(event)">

        <button class="send-btn"
                onclick="sendMessage()">
          ➤
        </button>

      </div>

    </main>


    <!-- RIGHT REQUESTS -->
    <aside id="rightbar" class="rightbar">

      <div class="right-title">
        Friend Requests
      </div>

      <div id="requests"
           class="requests">

/* =========================================================

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function formatTime(date){
  try{
    return new Date(date).toLocaleTimeString([],{
      hour:"2-digit",
      minute:"2-digit"
    });
  }catch{
    return "";
  }
}


function showToast(text){

function roomFor(a,b){

function getInitial(profile){

/* =========================================================

async function signupUser(){

  clearAuthError();

  const email =
    document.getElementById("signupEmail").value.trim();

  const password =
    document.getElementById("signupPassword").value;

  const username =
    document.getElementById("signupUsername").value.trim();

  const displayName =
    document.getElementById("signupDisplay").value.trim();

  if(!email || !password || !username){
    showAuthError("Email, password aur username required hain.");
    return;
  }

  if(password.length < 6){
    showAuthError("Password kam az kam 6 characters ka hona chahiye.");
    return;
  }

  try{

    const check =
      await sb
      .from("profiles")
      .select("id")
      .eq("username",username)
      .maybeSingle();

    if(check.error){
      showAuthError(check.error.message);
      return;
    }

    if(check.data){
      showAuthError("Ye username already use ho raha hai.");
      return;
    }

    const result =
      await sb.auth.signUp({
        email,
        password,
        options:{
          data:{
            username,
            display_name:displayName || username
          }
        }
      });

    if(result.error){
      showAuthError(result.error.message);
      return;
    }

    if(!result.data.session){
      showAuthError(
        "Account ban gaya. Agar email confirmation enabled hai to email verify karke login karein."
      );
      showLogin();
      return;
    }

    currentUser=result.data.user;

    await ensureProfile(
      username,
      displayName || username
    );

    await enterApp();

  }catch(error){
    showAuthError(error.message);
  }
}

async function loadFriends(){

  if(!currentUser || currentUser.is_anonymous){
    friends=[];
    renderFriends();
    return;
  }

  const {data,error} =
    await sb
    .from("friendships")
    .select("*")
    .or(
      `user_id.eq.${currentUser.id},friend_id.eq.${currentUser.id}`
    );

  if(error){
    console.error(error);
    renderFriends();
    return;
  }

  const ids=[];

  for(const row of data||[]){

    const id=
      row.user_id===currentUser.id
        ? row.friend_id
        : row.user_id;

    if(id && id!==currentUser.id){
      ids.push(id);
    }
  }

  const uniqueIds=[...new Set(ids)];

  friends=[];

  for(const id of uniqueIds){

    const p=await getProfile(id);

    if(p){
      friends.push(p);
    }
  }

  renderFriends();
}

    `;

}


async function sendFriendRequest(userId){

  if(!currentUser || currentUser.is_anonymous){
    showToast("Login required.");
    return;
  }

  if(userId===currentUser.id){
    return;
  }

  const existingFriend=
    friends.some(f=>f.id===userId);

  if(existingFriend){
    showToast("Already friends.");
    return;
  }

  const {data:existing,error:findError} =
    await sb
    .from("friend_requests")
    .select("*")
    .or(
      `and(sender_id.eq.${currentUser.id},receiver_id.eq.${userId}),and(sender_id.eq.${userId},receiver_id.eq.${currentUser.id})`
    )
    .maybeSingle();

  if(findError){
    console.error(findError);
  }

  if(existing){

    if(existing.status==="pending"){
      showToast("Friend request already pending.");
      return;
    }

    if(
      existing.status==="rejected" &&
      existing.sender_id===currentUser.id
    ){

      const {error} =
        await sb
        .from("friend_requests")
        .update({status:"pending"})
        .eq("id",existing.id);

      if(error){
        showToast(error.message);
      }else{
        showToast("Friend request sent.");
      }

      return;
    }

    if(
      existing.status==="pending" &&
      existing.receiver_id===currentUser.id
    ){
      showToast("This user already sent you a request.");
      return;
    }
  }

  const {error} =
    await sb
    .from("friend_requests")
    .insert({
      sender_id:currentUser.id,
      receiver_id:userId,
      status:"pending"
    });

  if(error){
    console.error(error);
    showToast("Request failed: "+error.message);
    return;
  }

  showToast("Friend request sent.");
}


async function acceptFriendRequest(requestId,senderId){

  if(!currentUser) return;

  const first=
    await sb
    .from("friendships")
    .insert({
      user_id:currentUser.id,
      friend_id:senderId
    });

  if(first.error &&
     !first.error.message.toLowerCase().includes("duplicate")){
    console.error(first.error);
  }

  const second=
    await sb
    .from("friendships")
    .insert({
      user_id:senderId,
      friend_id:currentUser.id
    });

  if(second.error &&
     !second.error.message.toLowerCase().includes("duplicate")){
    console.error(second.error);
  }

  const {error} =
    await sb
    .from("friend_requests")
    .update({
      status:"accepted"
    })
    .eq("id",requestId)
    .eq("receiver_id",currentUser.id);

  if(error){
    showToast(error.message);
    return;
  }

  showToast("Friend added.");

  await loadFriends();
  await loadRequests();
}


async function rejectFriendRequest(requestId){

  const {error} =
    await sb
    .from("friend_requests")
    .update({
      status:"rejected"
    })
    .eq("id",requestId)
    .eq("receiver_id",currentUser.id);

  if(error){
    showToast(error.message);
    return;
  }

  await loadRequests();

  showToast("Request rejected.");
}

========================================================= */

async function handleUserClick(userId){

  if(!currentUser) return;

  if(userId===currentUser.id){
    openOwnProfile();
    return;
  }

  const isFriend=
    friends.some(f=>f.id===userId);

  if(isFriend){

    /* IMPORTANT:
       Friend avatar/name -> DIRECT CHAT
    */

    await openPrivateChat(userId);

  }else{

    await openUserProfile(userId);

  }
}


/* =========================================================
   PROFILE MODALS
========================================================= */

async function openOwnProfile(){

  if(!currentUser) return;

  const profile=
    currentProfile ||
    await getProfile(currentUser.id);

  if(!profile) return;

  document.getElementById("profileModalContent").innerHTML=`

    <div class="profile-box">

      ${avatarHtml(profile,"big")}

      <div class="profile-name">
        ${escapeHtml(
          profile.display_name ||
          profile.username ||
          "User"
        )}
      </div>

      <div class="profile-username">
        @${escapeHtml(profile.username || "")}
      </div>

      <div class="profile-bio">
        ${escapeHtml(profile.bio || "No bio added.")}
      </div>

      <div class="profile-actions">

        <button class="profile-action"
                onclick="editProfile()">
          ✏️ Edit Profile
        </button>

        <button class="profile-action danger"
                onclick="logoutUser()">
          ⎋ Logout
        </button>

      </div>

      <div style="
        margin-top:18px;
        font-size:11px;
        color:#a0abb4;">
        Developer Cherry — From Danish School Mailsi
      </div>

    </div>
  `;

  document.getElementById("profileModal")
    .classList.remove("hidden");
}


async function openUserProfile(userId){

  const profile=
    await getProfile(userId);

  if(!profile) return;

  const isFriend=
    friends.some(f=>f.id===userId);

  document.getElementById("profileModalContent").innerHTML=`

    <div class="profile-box">

      ${avatarHtml(profile,"big")}

      <div class="profile-name">
        ${escapeHtml(
          profile.display_name ||
          profile.username ||
          "User"
        )}
      </div>

      <div class="profile-username">
        @${escapeHtml(profile.username || "")}
      </div>

      <div class="profile-bio">
        ${escapeHtml(profile.bio || "No bio added.")}
      </div>

      <div class="profile-actions">

        ${
          isFriend
          ? `
            <button class="profile-action"
                    onclick="closeModal('profileModal');openPrivateChat('${userId}')">
              💬 Chat
            </button>

            <button class="profile-action"
                    onclick="closeModal('profileModal');startVoiceCallTo('${userId}')">
              📞 Voice
            </button>

            <button class="profile-action"
                    onclick="closeModal('profileModal');startVideoCallTo('${userId}')">
              🎥 Video
            </button>

            <button class="profile-action danger"
                    onclick="unfriend('${userId}')">
              Remove Friend
            </button>
          `
          : `
            <button class="profile-action green"
                    onclick="sendFriendRequest('${userId}');closeModal('profileModal')">
              ➕ Add Friend
            </button>
          `
        }

        <button class="profile-action danger"
                onclick="blockUser('${userId}')">
          🚫 Block
        </button>

      </div>

    </div>
  `;

  document.getElementById("profileModal")
    .classList.remove("hidden");
}


function openCurrentFriendProfile(){

  if(currentFriend){
    openUserProfile(currentFriend.id);
  }
}


function closeModal(id){
  document.getElementById(id).classList.add("hidden");
}


function closeModalOutside(event,id){

  if(event.target.id===id){
    closeModal(id);
  }
}


/* =========================================================
   EDIT PROFILE
========================================================= */

async function editProfile(){

  if(!currentProfile || currentUser?.is_anonymous){
    showToast("Anonymous profile cannot be edited.");
    return;
  }

  const displayName=
    prompt(
      "Display name:",
      currentProfile.display_name || ""
    );

  if(displayName===null) return;

  const bio=
    prompt(
      "Bio:",
      currentProfile.bio || ""
    );

  if(bio===null) return;

  const {data,error} =
    await sb
    .from("profiles")
    .update({
      display_name:displayName.trim() || currentProfile.username,
      bio:bio.trim()
    })
    .eq("id",currentUser.id)
    .select()
    .single();

  if(error){
    showToast(error.message);
    return;
  }

  currentProfile=data;
  profilesCache[data.id]=data;

  closeModal("profileModal");

  showToast("Profile updated.");

  if(currentRoom==="public"){
    await loadPublicMessages();
  }
}


/* =========================================================
   UNFRIEND
========================================================= */

async function unfriend(friendId){

  if(!currentUser) return;

  if(!confirm("Is friend ko remove karna hai?")){
    return;
  }

  await sb
    .from("friendships")
    .delete()
    .or(
      `and(user_id.eq.${currentUser.id},friend_id.eq.${friendId}),and(user_id.eq.${friendId},friend_id.eq.${currentUser.id})`
    );

  friends=
    friends.filter(f=>f.id!==friendId);

  renderFriends();

  if(currentFriend?.id===friendId){
    await openPublicChat();
  }

  closeModal("profileModal");

  showToast("Friend removed.");
}


/* =========================================================
   BLOCK
========================================================= */

async function blockUser(userId){

  if(!currentUser) return;

  if(!confirm("Is user ko block karna hai?")){
    return;
  }

  const {error} =
    await sb
    .from("blocks")
    .insert({
      blocker_id:currentUser.id,
      blocked_id:userId
    });

  if(error &&
     !error.message.toLowerCase().includes("duplicate")){
    showToast(error.message);
    return;
  }

  friends=
    friends.filter(f=>f.id!==userId);

  renderFriends();

  if(currentFriend?.id===userId){
    await openPublicChat();
  }

  closeModal("profileModal");

  showToast("User blocked.");
}


/* =========================================================
   NOTIFICATIONS
========================================================= */

function addNotification(message){

  const profile=
    profilesCache[message.sender_id] ||
    {
      display_name:message.nickname || "User",
      username:message.nickname || "User"
    };

  notifications.unshift({
    id:message.id,
    sender_id:message.sender_id,
    room:message.room,
    message:message.message,
    profile
  });

  notifications=
    notifications.slice(0,30);

  renderNotifications();

  document.getElementById("notifyDot")
    .style.display="block";

  browserNotify(
    profile.display_name || profile.username || "New message",
    message.message
  );
}


function renderNotifications(){

  const list=
    document.getElementById("notificationList");

  if(!notifications.length){

    list.innerHTML=`
      <div style="padding:15px;color:#8997a3;font-size:12px;">
        No notifications
      </div>
    `;

    return;
  }

  list.innerHTML=
    notifications.map(n=>`

      <div class="notification"
           onclick="notificationOpen('${n.sender_id}')">

        ${avatarHtml(n.profile,"small")}

        <div class="notification-text">

          <strong>
            ${escapeHtml(
              n.profile.display_name ||
              n.profile.username ||
              "User"
            )}
          </strong>

          sent you a message:

          <br>

          ${escapeHtml(n.message)}

        </div>

      </div>

    `).join("");
}


function toggleNotifications(){

  const panel=
    document.getElementById("notificationPanel");

  panel.classList.toggle("hidden");

  if(!panel.classList.contains("hidden")){

    document.getElementById("notifyDot")
      .style.display="none";
  }
}


async function notificationOpen(userId){

  document.getElementById("notificationPanel")
    .classList.add("hidden");

  const isFriend=
    friends.some(f=>f.id===userId);

  if(isFriend){
    await openPrivateChat(userId);
  }else{
    await openUserProfile(userId);
  }
}


/* =========================================================
   BROWSER NOTIFICATIONS
========================================================= */

async function requestNotificationPermission(){

  if(!("Notification" in window)){
    return;
  }

  if(Notification.permission==="default"){

    try{
      await Notification.requestPermission();
    }catch{}
  }
}


function browserNotify(title,body){

  if(
    !("Notification" in window) ||
    Notification.permission!=="granted"
  ){
    return;
  }

  if(document.visibilityState==="visible"){
    return;
  }

  try{
    new Notification(title,{
      body,
      icon:"data:image/svg+xml,"+
        encodeURIComponent(`
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
            <rect width="100" height="100" rx="20" fill="#168ce8"/>
            <circle cx="39" cy="45" r="6" fill="white"/>
            <circle cx="61" cy="45" r="6" fill="white"/>
            <path d="M34 58C40 68 60 68 66 58C57 62 43 62 34 58Z" fill="white"/>
          </svg>
        `)
    });
  }catch{}
}


/* =========================================================
   REALTIME
========================================================= */

function setupRealtime(){

  if(realtimeChannel){
    sb.removeChannel(realtimeChannel);
  }

  realtimeChannel=
    sb
    .channel("shadow-chat-realtime-"+Date.now())

    .on(
      "postgres_changes",
      {
        event:"INSERT",
        schema:"public",
        table:"messages"
      },
      async payload=>{

        const m=payload.new;

        if(m.message_type!=="chat"){
          return;
        }

        profilesCache[m.sender_id] =
          profilesCache[m.sender_id] ||
          await getProfile(m.sender_id);

        if(m.room==="public"){

          if(currentRoom==="public"){
            await loadPublicMessages();
          }

          return;
        }

        const isForMe=
          m.receiver_id===currentUser?.id;

        if(isForMe){

          const sameChat=
            currentRoom==="private" &&
            currentFriend &&
            m.room===
              roomFor(currentUser.id,currentFriend.id);

          if(!sameChat){
            addNotification(m);
          }

          if(sameChat){
            await loadPrivateMessages(currentFriend.id);
          }

          return;
        }

        if(
          currentRoom==="private" &&
          currentFriend &&
          m.room===
            roomFor(currentUser.id,currentFriend.id)
        ){
          await loadPrivateMessages(currentFriend.id);
        }

      }
    )

    .on(
      "postgres_changes",
      {
        event:"UPDATE",
        schema:"public",
        table:"messages"
      },
      async payload=>{

        const m=payload.new;

        if(m.message_type!=="chat"){
          return;
        }

        if(m.room==="public"){

          if(currentRoom==="public"){
            await loadPublicMessages();
          }

          return;
        }

        if(
          currentRoom==="private" &&
          currentFriend &&
          m.room===
            roomFor(currentUser.id,currentFriend.id)
        ){
          await loadPrivateMessages(currentFriend.id);
        }

      }
    )

    .subscribe();
}


/* =========================================================
   FRIEND REALTIME
========================================================= */

async function setupFriendRealtime(){

  if(!currentUser || currentUser.is_anonymous){
    return;
  }

  if(requestChannel){
    sb.removeChannel(requestChannel);
  }

  requestChannel=
    sb
    .channel("friend-request-"+currentUser.id)

    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"friend_requests"
      },
      async()=>{
        await loadRequests();
      }
    )

    .subscribe();

  if(friendChannel){
    sb.removeChannel(friendChannel);
  }

  friendChannel=
    sb
    .channel("friendship-"+currentUser.id)

    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"friendships"
      },
      async()=>{
        await loadFriends();
      }
    )

    .subscribe();
}

   MOBILE
========================================================= */

/* =========================================================
   VOICE / VIDEO CALLS
========================================================= */

function getCallChannelName(userId){
  return "private-call-"+userId;
}


function setupCallChannel(){

  if(!currentUser) return;

  if(callChannel){
    sb.removeChannel(callChannel);
  }

  callChannel=
    sb
    .channel(
      getCallChannelName(currentUser.id)
    )

    .on(
      "broadcast",
      {event:"call-offer"},
      async payload=>{
        await receiveCallOffer(payload.payload);
      }
    )

    .on(
      "broadcast",
      {event:"call-answer"},
      async payload=>{
        await receiveCallAnswer(payload.payload);
      }
    )

    .on(
      "broadcast",
      {event:"ice-candidate"},
      async payload=>{
        await receiveIceCandidate(payload.payload);
      }
    )

    .on(
      "broadcast",
      {event:"call-end"},
      async()=>{
        closeCallUI();
      }
    )

    .subscribe();
}


async function createPeerConnection(friendId){

  peerConnection=
    new RTCPeerConnection({
      iceServers:[
        {
          urls:"stun:stun.l.google.com:19302"
        }
      ]
    });

  peerConnection.onicecandidate=async event=>{

    if(!event.candidate) return;

    await sendCallSignal(
      friendId,
      "ice-candidate",
      {
        candidate:event.candidate,
        from:currentUser.id
      }
    );
  };

  peerConnection.ontrack=event=>{

    const remote=
      document.getElementById("remoteVideo");

    if(remote){
      remote.srcObject=event.streams[0];
    }
  };

  peerConnection.onconnectionstatechange=()=>{

    if(
      peerConnection &&
      ["failed","disconnected","closed"]
        .includes(peerConnection.connectionState)
    ){
      document.getElementById("callStatus")
        .textContent="Call ended.";
    }
  };

  return peerConnection;
}


async function sendCallSignal(friendId,event,payload){

  const channel=
    sb.channel(getCallChannelName(friendId));

  await channel.subscribe();

  await channel.send({
    type:"broadcast",
    event,
    payload
  });

  setTimeout(()=>{
    sb.removeChannel(channel);
  },3000);
}


async function startVoiceCall(){

  if(!currentFriend) return;

  await startCallTo(
    currentFriend.id,
    false
  );
}


async function startVideoCall(){

  if(!currentFriend) return;

  await startCallTo(
    currentFriend.id,
    true
  );
}


async function startVoiceCallTo(friendId){
  await startCallTo(friendId,false);
}


async function startVideoCallTo(friendId){
  await startCallTo(friendId,true);
}


async function startCallTo(friendId,video){

  if(!currentUser || currentUser.is_anonymous){
    showToast("Login required.");
    return;
  }

  const profile=
    await getProfile(friendId);

  if(!profile){
    showToast("User not found.");
    return;
  }

  activeCallFriend=friendId;
  activeCallVideo=video;

  document.getElementById("callTitle").textContent=
    "Calling "+(
      profile.display_name ||
      profile.username ||
      "User"
    );

  document.getElementById("callStatus").textContent=
    video ? "Starting video call..." : "Starting voice call...";

  document.getElementById("acceptCallBtn")
    .classList.add("hidden");

  document.getElementById("callAvatar")
    .innerHTML=
      profile.avatar_url
      ? `<img src="${escapeHtml(profile.avatar_url)}" style="width:100%;height:100%;object-fit:cover;">`
      : escapeHtml(getInitial(profile));

  document.getElementById("callModal")
    .classList.remove("hidden");

  try{

    localStream=
      await navigator.mediaDevices.getUserMedia({
        audio:true,
        video:video
      });

    document.getElementById("localVideo")
      .srcObject=localStream;

    if(video){

      document.getElementById("videoArea")
        .classList.remove("hidden");

      document.getElementById("callAvatar")
        .classList.add("hidden");

    }else{

      document.getElementById("videoArea")
        .classList.add("hidden");

      document.getElementById("callAvatar")
        .classList.remove("hidden");
    }

    await createPeerConnection(friendId);

    localStream
      .getTracks()
      .forEach(track=>{
        peerConnection.addTrack(
          track,
          localStream
        );
      });

    const offer=
      await peerConnection.createOffer();

    await peerConnection.setLocalDescription(offer);

    await sendCallSignal(
      friendId,
      "call-offer",
      {
        offer,
        callerId:currentUser.id,
        video
      }
    );

    document.getElementById("callStatus")
      .textContent="Calling...";

  }catch(error){

    console.error(error);

    showToast(
      "Camera/microphone permission required."
    );

    endCall();
  }
}


/* =========================================================
   INCOMING CALL
========================================================= */

async function receiveCallOffer(data){

  if(!currentUser || currentUser.id===data.callerId){
    return;
  }

  incomingOffer=data.offer;
  incomingCaller=data.callerId;
  activeCallFriend=data.callerId;
  activeCallVideo=!!data.video;

  const profile=
    await getProfile(data.callerId);

  document.getElementById("callTitle").textContent=
    profile?.display_name ||
    profile?.username ||
    "Incoming Call";

  document.getElementById("callStatus").textContent=
    data.video
      ? "Incoming video call"
      : "Incoming voice call";

  document.getElementById("acceptCallBtn")
    .classList.remove("hidden");

  if(data.video){

    document.getElementById("videoArea")
      .classList.remove("hidden");

  }else{

    document.getElementById("videoArea")
      .classList.add("hidden");
  }

  document.getElementById("callAvatar")
    .classList.remove("hidden");

  if(profile){

    document.getElementById("callAvatar")
      .innerHTML=
        profile.avatar_url
        ? `<img src="${escapeHtml(profile.avatar_url)}" style="width:100%;height:100%;object-fit:cover;">`
        : escapeHtml(getInitial(profile));
  }

  document.getElementById("callModal")
    .classList.remove("hidden");

  browserNotify(
    "Incoming call",
    (profile?.display_name || "Someone")+" is calling you"
  );
}


async function acceptIncomingCall(){

  if(!incomingOffer || !incomingCaller){
    return;
  }

  try{

    localStream=
      await navigator.mediaDevices.getUserMedia({
        audio:true,
        video:activeCallVideo
      });

    document.getElementById("localVideo")
      .srcObject=localStream;

    if(activeCallVideo){

      document.getElementById("videoArea")
        .classList.remove("hidden");

      document.getElementById("callAvatar")
        .classList.add("hidden");

    }

    await createPeerConnection(incomingCaller);

    localStream
      .getTracks()
      .forEach(track=>{
        peerConnection.addTrack(
          track,
          localStream
        );
      });

    await peerConnection.setRemoteDescription(
      new RTCSessionDescription(incomingOffer)
    );

    const answer=
      await peerConnection.createAnswer();

    await peerConnection.setLocalDescription(answer);

    await sendCallSignal(
      incomingCaller,
      "call-answer",
      {
        answer,
        from:currentUser.id
      }
    );

    document.getElementById("acceptCallBtn")
      .classList.add("hidden");

    document.getElementById("callStatus")
      .textContent="Connected";

    incomingOffer=null;
    incomingCaller=null;

  }catch(error){

    console.error(error);

    showToast(
      "Call accept failed: "+error.message
    );

    endCall();
  }
}


async function receiveCallAnswer(data){

  if(!peerConnection){
    return;
  }

  try{

    await peerConnection.setRemoteDescription(
      new RTCSessionDescription(data.answer)
    );

    document.getElementById("callStatus")
      .textContent="Connected";

  }catch(error){
    console.error(error);
  }
}


async function receiveIceCandidate(data){

  if(!peerConnection || !data.candidate){
    return;
  }

  try{

    await peerConnection.addIceCandidate(
      new RTCIceCandidate(data.candidate)
    );

  }catch(error){
    console.error(error);
  }
}


async function endCall(){

  if(activeCallFriend){

    try{

      await sendCallSignal(
        activeCallFriend,
        "call-end",
        {
          from:currentUser?.id
        }
      );

    }catch{}
  }

  closeCallUI();
}


function closeCallUI(){

  if(localStream){

    localStream
      .getTracks()
      .forEach(track=>track.stop());

    localStream=null;
  }

  if(peerConnection){

    peerConnection.close();
    peerConnection=null;
  }

  const localVideo=
    document.getElementById("localVideo");

  const remoteVideo=
    document.getElementById("remoteVideo");

  if(localVideo){
    localVideo.srcObject=null;
  }

  if(remoteVideo){
    remoteVideo.srcObject=null;
  }

  document.getElementById("callModal")
    .classList.add("hidden");

  document.getElementById("acceptCallBtn")
    .classList.add("hidden");

  document.getElementById("videoArea")
    .classList.add("hidden");

  activeCallFriend=null;
  incomingOffer=null;
  incomingCaller=null;
}


/* =========================================================
   INIT
========================================================= */

async function init(){

  const sessionResult=
    await sb.auth.getSession();

  if(sessionResult.data.session){

    currentUser=
      sessionResult.data.session.user;

    await enterApp();

  }else{

    document.getElementById("authScreen")
      .classList.remove("hidden");

    document.getElementById("app")
      .classList.add("hidden");
  }


  sb.auth.onAuthStateChange(
    async(event,session)=>{

      if(
        session &&
        !currentUser
      ){

        currentUser=session.user;

        await enterApp();
      }

    }
  );
}


/* =========================================================
   EXTRA REALTIME INIT
========================================================= */

setTimeout(()=>{
  if(currentUser){
    setupFriendRealtime();
  }
},1500);


/* =========================================================
   START
========================================================= */

init();

</script>

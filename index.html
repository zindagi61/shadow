<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

<title>Shadow Chat Daanians</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#f4fbff;
  --card:#ffffff;
  --primary:#38a8ff;
  --primary2:#1689e8;
  --soft:#e8f6ff;
  --soft2:#d8efff;
  --text:#123047;
  --muted:#71899b;
  --border:#dceef9;
  --danger:#ef5b6b;
  --success:#27b77a;
  --shadow:0 10px 35px rgba(32,139,208,.10);
  --radius:20px;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
}

body{
  overflow:hidden;
}

button,input,textarea{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

#app{
  width:100%;
  height:100dvh;
  min-height:100dvh;
  overflow:hidden;
}

/* ================= ICONS ================= */

.icon{
  width:21px;
  height:21px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex:none;
}

.icon svg{
  width:100%;
  height:100%;
  fill:none;
  stroke:currentColor;
  stroke-width:1.9;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* ================= AUTH ================= */

.auth-screen{
  height:100dvh;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at 10% 10%,rgba(56,168,255,.16),transparent 30%),
    radial-gradient(circle at 90% 90%,rgba(56,168,255,.12),transparent 30%),
    var(--bg);
  overflow:auto;
}

.auth-card{
  width:min(430px,100%);
  background:#fff;
  border:1px solid var(--border);
  border-radius:28px;
  box-shadow:0 25px 70px rgba(20,110,170,.13);
  padding:30px;
}

.logo-wrap{
  text-align:center;
  margin-bottom:25px;
}

.logo{
  width:72px;
  height:72px;
  margin:auto;
  border-radius:23px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  box-shadow:0 14px 30px rgba(22,137,232,.25);
}

.logo .icon{
  width:38px;
  height:38px;
}

.logo-title{
  font-size:25px;
  font-weight:800;
  margin-top:14px;
}

.logo-sub{
  color:var(--muted);
  font-size:13px;
  margin-top:5px;
}

.auth-tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  background:#f1f8fc;
  padding:5px;
  border-radius:13px;
  margin-bottom:18px;
}

.auth-tabs button{
  padding:10px;
  border-radius:10px;
  background:transparent;
  color:var(--muted);
  font-weight:700;
}

.auth-tabs button.active{
  background:#fff;
  color:var(--primary2);
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.field{
  margin-bottom:12px;
}

.field label{
  display:block;
  font-size:12px;
  font-weight:700;
  margin-bottom:6px;
  color:#547084;
}

.field input,
.field textarea,
.search-input{
  width:100%;
  border:1px solid var(--border);
  background:#fbfdff;
  outline:none;
  border-radius:13px;
  padding:12px 13px;
  color:var(--text);
  transition:.2s;
}

.field input:focus,
.field textarea:focus,
.search-input:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(56,168,255,.10);
}

.primary-btn{
  width:100%;
  padding:13px;
  border-radius:13px;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  color:#fff;
  font-weight:800;
  box-shadow:0 8px 20px rgba(22,137,232,.20);
  transition:.2s;
}

.primary-btn:active{
  transform:scale(.98);
}

.secondary-btn{
  width:100%;
  padding:12px;
  border-radius:13px;
  background:var(--soft);
  color:var(--primary2);
  font-weight:800;
}

.auth-divider{
  display:flex;
  align-items:center;
  gap:10px;
  margin:17px 0;
  color:#9aabb7;
  font-size:11px;
}

.auth-divider:before,
.auth-divider:after{
  content:"";
  height:1px;
  background:var(--border);
  flex:1;
}

.auth-error{
  display:none;
  background:#fff0f2;
  color:#c93c50;
  border:1px solid #ffd8de;
  border-radius:12px;
  padding:10px;
  font-size:12px;
  margin-bottom:12px;
}

/* ================= MAIN ================= */

.main-app{
  width:100%;
  height:100dvh;
  min-height:100dvh;
  display:grid;
  grid-template-columns:280px minmax(0,1fr) 300px;
  gap:12px;
  padding:12px;
}

.panel{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  min-width:0;
  min-height:0;
  overflow:hidden;
}

/* LEFT */

.left-panel{
  display:flex;
  flex-direction:column;
}

.brand{
  padding:20px 18px 12px;
  display:flex;
  align-items:center;
  gap:11px;
}

.brand-icon{
  width:42px;
  height:42px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
}

.brand-icon .icon{
  width:24px;
  height:24px;
}

.brand-name{
  font-size:17px;
  font-weight:850;
}

.brand-small{
  font-size:10px;
  color:var(--muted);
}

.nav{
  padding:8px 10px;
}

.nav-btn{
  width:100%;
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px 12px;
  border-radius:12px;
  color:#60798b;
  background:transparent;
  margin-bottom:4px;
  font-weight:700;
  text-align:left;
}

.nav-btn:hover,
.nav-btn.active{
  color:var(--primary2);
  background:var(--soft);
}

.nav-label{
  flex:1;
}

.badge{
  min-width:20px;
  height:20px;
  padding:0 6px;
  display:none;
  align-items:center;
  justify-content:center;
  border-radius:20px;
  background:#ff5e76;
  color:#fff;
  font-size:10px;
  font-weight:800;
}

.online-title{
  padding:14px 17px 8px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:12px;
  font-weight:800;
  color:#587286;
}

.online-count{
  color:var(--success);
}

.online-list{
  flex:1;
  min-height:0;
  overflow:auto;
  padding:0 10px 10px;
}

.online-user{
  display:flex;
  align-items:center;
  gap:9px;
  padding:9px 7px;
  border-radius:12px;
  cursor:pointer;
}

.online-user:hover{
  background:#f4faff;
}

.avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  object-fit:cover;
  background:linear-gradient(135deg,#dff3ff,#bce5ff);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#1487d8;
  font-weight:850;
  overflow:hidden;
  position:relative;
  flex:none;
}

.avatar.small{
  width:34px;
  height:34px;
  font-size:11px;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.online-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#24c87f;
  border:2px solid #fff;
  position:absolute;
  right:0;
  bottom:1px;
}

.online-name{
  min-width:0;
  flex:1;
}

.online-name b{
  display:block;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:12px;
}

.online-name span{
  color:#35b778;
  font-size:10px;
}

/* CENTER */

.center-panel{
  display:flex;
  flex-direction:column;
  min-height:0;
}

.chat-header{
  min-height:70px;
  flex:none;
  border-bottom:1px solid var(--border);
  padding:12px 16px;
  display:flex;
  align-items:center;
  gap:11px;
}

.header-user{
  display:flex;
  align-items:center;
  gap:10px;
  flex:1;
  min-width:0;
  cursor:pointer;
}

.header-info{
  min-width:0;
}

.header-info b{
  display:block;
  font-size:14px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.header-info span{
  display:block;
  font-size:10px;
  color:var(--muted);
  margin-top:2px;
}

.header-actions{
  display:flex;
  gap:6px;
}

.circle-btn{
  width:39px;
  height:39px;
  border-radius:12px;
  background:#f2f9fd;
  color:#598096;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

.circle-btn:hover{
  background:var(--soft);
  color:var(--primary2);
}

.notification-dot{
  position:absolute;
  width:8px;
  height:8px;
  background:#ff5770;
  border-radius:50%;
  right:7px;
  top:6px;
  display:none;
  border:2px solid #fff;
}

.chat-messages{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:9px;
  background:
    radial-gradient(circle at 20% 20%,rgba(56,168,255,.035),transparent 30%),
    #fbfdff;
}

.empty{
  margin:auto;
  text-align:center;
  color:var(--muted);
  padding:30px;
}

.empty .icon{
  width:48px;
  height:48px;
  margin:auto;
  color:#a8d9f7;
}

.empty b{
  display:block;
  color:#597589;
  margin-top:9px;
}

.message-row{
  display:flex;
  gap:8px;
  max-width:82%;
  align-items:flex-end;
}

.message-row.mine{
  align-self:flex-end;
  flex-direction:row-reverse;
}

.message-content{
  min-width:0;
}

.message-sender{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:10px;
  color:#5d788b;
  margin:0 0 3px 4px;
  cursor:pointer;
}

.message-sender:hover{
  color:var(--primary2);
}

.message-bubble{
  background:#fff;
  border:1px solid var(--border);
  padding:9px 12px;
  border-radius:16px 16px 16px 5px;
  box-shadow:0 3px 10px rgba(20,100,150,.045);
  word-break:break-word;
  white-space:pre-wrap;
  font-size:13px;
  line-height:1.4;
}

.mine .message-bubble{
  color:#fff;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  border-color:transparent;
  border-radius:16px 16px 5px 16px;
}

.message-time{
  font-size:8px;
  color:#91a5b1;
  margin:3px 5px 0;
}

.mine .message-time{
  text-align:right;
}

.composer{
  flex:none;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  border-top:1px solid var(--border);
  background:#fff;
  display:flex;
  gap:7px;
  align-items:flex-end;
}

.composer textarea{
  flex:1;
  min-width:0;
  max-height:110px;
  resize:none;
  border:1px solid var(--border);
  background:#f9fcfe;
  border-radius:15px;
  padding:11px 13px;
  outline:none;
  color:var(--text);
}

.composer textarea:focus{
  border-color:var(--primary);
}

.send-btn{
  width:43px;
  height:43px;
  border-radius:14px;
  color:#fff;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
}

.send-btn .icon{
  width:19px;
  height:19px;
}

/* RIGHT */

.right-panel{
  display:flex;
  flex-direction:column;
  min-height:0;
}

.right-top{
  padding:18px;
  border-bottom:1px solid var(--border);
}

.right-title{
  font-size:15px;
  font-weight:850;
}

.right-sub{
  font-size:11px;
  color:var(--muted);
  margin-top:3px;
}

.feature-list{
  padding:10px;
  overflow:auto;
}

.feature-card{
  padding:13px;
  border:1px solid var(--border);
  border-radius:15px;
  margin-bottom:8px;
  cursor:pointer;
  display:flex;
  gap:11px;
  align-items:center;
}

.feature-card:hover{
  background:var(--soft);
  border-color:#bfe4fa;
}

.feature-icon{
  width:40px;
  height:40px;
  border-radius:13px;
  background:var(--soft);
  color:var(--primary2);
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
}

.feature-card b{
  font-size:12px;
}

.feature-card span{
  display:block;
  font-size:10px;
  color:var(--muted);
  margin-top:3px;
}

/* ================= MOBILE NAV ================= */

.mobile-nav{
  display:none;
}

/* ================= VIEWS / MODALS ================= */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(9,39,58,.25);
  backdrop-filter:blur(5px);
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:16px;
}

.modal{
  width:min(460px,100%);
  max-height:min(720px,90dvh);
  overflow:auto;
  background:#fff;
  border:1px solid var(--border);
  border-radius:24px;
  box-shadow:0 30px 80px rgba(10,80,120,.22);
  padding:20px;
  animation:pop .2s ease;
}

@keyframes pop{
  from{transform:scale(.95);opacity:0}
  to{transform:scale(1);opacity:1}
}

.modal-head{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:16px;
}

.modal-head h3{
  flex:1;
  margin:0;
  font-size:16px;
}

.close-btn{
  width:35px;
  height:35px;
  border-radius:10px;
  background:#f2f8fb;
  color:#607b8d;
  display:flex;
  align-items:center;
  justify-content:center;
}

.profile-cover{
  text-align:center;
}

.profile-cover .avatar{
  width:85px;
  height:85px;
  margin:auto;
  font-size:25px;
}

.profile-name{
  font-size:19px;
  font-weight:850;
  margin-top:10px;
}

.profile-username{
  color:var(--primary2);
  font-size:12px;
  margin-top:3px;
}

.profile-bio{
  color:#60798a;
  font-size:12px;
  margin:10px auto 15px;
  max-width:330px;
  line-height:1.5;
}

.profile-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.action-btn{
  min-height:42px;
  padding:9px 11px;
  border-radius:12px;
  background:var(--soft);
  color:var(--primary2);
  font-weight:750;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
}

.action-btn.danger{
  background:#fff0f2;
  color:#df4d62;
}

.action-btn.dark{
  background:#eef3f6;
  color:#536b7b;
}

.action-btn.success{
  background:#eafbf3;
  color:#1f9b68;
}

.search-box{
  position:relative;
  margin-bottom:12px;
}

.search-box .icon{
  position:absolute;
  left:12px;
  top:50%;
  transform:translateY(-50%);
  color:#8da3b0;
}

.search-box input{
  padding-left:40px;
}

.user-result{
  border:1px solid var(--border);
  border-radius:15px;
  padding:11px;
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:8px;
}

.user-result-info{
  flex:1;
  min-width:0;
}

.user-result-info b{
  display:block;
  font-size:12px;
}

.user-result-info span{
  font-size:10px;
  color:var(--muted);
}

.user-result-actions{
  display:flex;
  gap:5px;
}

.mini-btn{
  width:34px;
  height:34px;
  border-radius:10px;
  background:var(--soft);
  color:var(--primary2);
  display:flex;
  align-items:center;
  justify-content:center;
}

.mini-btn.danger{
  color:var(--danger);
  background:#fff0f2;
}

.toast-container{
  position:fixed;
  top:15px;
  right:15px;
  z-index:500;
  width:min(350px,calc(100vw - 30px));
  display:flex;
  flex-direction:column;
  gap:8px;
  pointer-events:none;
}

.toast{
  pointer-events:auto;
  background:#fff;
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:0 15px 40px rgba(10,90,140,.17);
  padding:11px;
  display:flex;
  gap:9px;
  align-items:center;
  animation:slideIn .25s ease;
}

@keyframes slideIn{
  from{opacity:0;transform:translateX(30px)}
  to{opacity:1;transform:translateX(0)}
}

.toast-text{
  flex:1;
  min-width:0;
}

.toast-text b{
  display:block;
  font-size:12px;
}

.toast-text span{
  display:block;
  font-size:11px;
  color:var(--muted);
  margin-top:2px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* CALL */

.call-overlay{
  position:fixed;
  inset:0;
  z-index:300;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(10,48,70,.62);
  backdrop-filter:blur(15px);
  padding:20px;
}

.call-card{
  width:min(370px,100%);
  text-align:center;
  color:#fff;
}

.call-avatar{
  width:105px;
  height:105px;
  border-radius:50%;
  margin:0 auto 18px;
  background:#fff;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--primary2);
  font-size:30px;
  box-shadow:0 0 0 10px rgba(255,255,255,.08);
}

.call-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.call-card h2{
  margin:0;
  font-size:22px;
}

.call-status{
  color:#d7edf8;
  font-size:12px;
  margin-top:7px;
}

.call-buttons{
  display:flex;
  justify-content:center;
  gap:15px;
  margin-top:28px;
}

.call-btn{
  width:58px;
  height:58px;
  border-radius:50%;
  color:#fff;
  background:rgba(255,255,255,.13);
  display:flex;
  align-items:center;
  justify-content:center;
}

.call-btn.accept{
  background:#20b978;
}

.call-btn.end{
  background:#ef5267;
}

.call-btn .icon{
  width:24px;
  height:24px;
}

/* VOICE */

.voice-card{
  text-align:center;
  padding:15px 5px;
}

.voice-circle{
  width:105px;
  height:105px;
  border-radius:50%;
  margin:10px auto 20px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#dff4ff,#bde5ff);
  color:var(--primary2);
  box-shadow:0 0 0 13px #eff9ff;
}

.voice-circle .icon{
  width:40px;
  height:40px;
}

.voice-card h2{
  margin:0;
  font-size:20px;
}

.voice-card p{
  font-size:11px;
  color:var(--muted);
}

.voice-users{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:7px;
  margin:18px 0;
}

.voice-user{
  border:1px solid var(--border);
  border-radius:30px;
  padding:5px 10px 5px 5px;
  display:flex;
  align-items:center;
  gap:6px;
  font-size:10px;
}

.voice-user .avatar{
  width:26px;
  height:26px;
}

/* PROFILE SETTINGS */

.profile-form-avatar{
  text-align:center;
  margin-bottom:16px;
}

.profile-form-avatar .avatar{
  width:90px;
  height:90px;
  margin:auto;
}

.upload-label{
  display:inline-flex;
  margin-top:8px;
  padding:7px 11px;
  border-radius:10px;
  background:var(--soft);
  color:var(--primary2);
  font-size:11px;
  font-weight:750;
  cursor:pointer;
}

/* ================= RESPONSIVE ================= */

@media(max-width:1100px){
  .main-app{
    grid-template-columns:235px minmax(0,1fr);
  }

  .right-panel{

async function init(){

  if(data.session){
    currentUser = data.session.user;
    anonymous = false;
    await startAuthenticated();
  }else{
    checkAnonymous();
  }

  sb.auth.onAuthStateChange(async (event,session)=>{

    if(event === "SIGNED_IN" && session){

      currentUser=session.user;
      anonymous=false;

      await startAuthenticated();

    }

    if(event === "SIGNED_OUT"){

      currentUser=null;
      currentProfile=null;
      anonymous=false;

      clearPresence();

      $("app").innerHTML=authHTML();
      setIcons();

    }

  });

function authError(msg){

  const el=$("authError");

  if(!el)return;

  el.style.display="block";
  el.textContent=msg;

}

async function login(){

  const email=$("loginEmail").value.trim();
  const password=$("loginPassword").value;

  if(!email || !password){
    authError("Email and password required.");
    return;
  }

  const {data,error}=await sb.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    authError(error.message);
    return;
  }

  currentUser=data.user;

}

async function signup(){

  const username=$("signupUsername").value.trim();
  const display=$("signupDisplay").value.trim();
  const email=$("signupEmail").value.trim();
  const password=$("signupPassword").value;

  if(!username || !display || !email || !password){
    authError("Please fill all fields.");
    return;
  }

  if(password.length<6){
    authError("Password must contain at least 6 characters.");
    return;
  }

  const {data,error}=await sb.auth.signUp({
    email,
    password,
    options:{
      data:{
        username,
        display_name:display
      }
    }
  });

  if(error){
    authError(error.message);
    return;
  }

  if(data.user){

    currentUser=data.user;

    /*
      Trigger creates profile.
      Now update it with requested username/display.
    */

    await new Promise(r=>setTimeout(r,700));

    const {error:updateError}=await sb
      .from("profiles")
      .update({
        username,
        display_name:display
      })
      .eq("id",data.user.id);

    if(updateError){

      if(
        String(updateError.message||"")
        .toLowerCase()
        .includes("duplicate")
      ){

        authError("This username is already taken.");

      }else{

        authError(updateError.message);

      }

      return;
    }

    alert("Account created successfully.");

  }

}

function mobileGo(view){

  document
    .querySelectorAll(".mobile-nav button")
    .forEach(x=>x.classList.remove("active"));

  const btn=document.querySelector(
    `.mobile-nav button[data-mobile="${view}"]`
  );

  if(view==="home"){
    currentRoom="public";
    currentFriend=null;
    setHeaderPublic();
    loadPublicMessages();
  }

}

/* =========================================================
   PRESENCE
   ========================================================= */

async function upsertPresence(){

  if(!currentUser || !currentProfile)return;

  const name=
    currentProfile.display_name ||
    currentProfile.username ||
    "Anonymous";

  const {error}=await sb
    .from("chat_users")
    .upsert({
      id:currentUser.id,
      nickname:name,
      created_at:new Date().toISOString()
    });

  if(error){
    console.warn("Presence:",error.message);
  }

}

function startPresenceHeartbeat(){

  clearInterval(presenceTimer);

  upsertPresence();

  presenceTimer=setInterval(async()=>{

    await upsertPresence();

    /*
      Remove stale users from local online list.
    */

    const now=Date.now();

    for(const [id,user] of onlineUsers){

      if(
        user._seen &&
        now-user._seen>PRESENCE_TIMEOUT
      ){

        onlineUsers.delete(id);

      }

    }

    renderOnlineUsers();

  },15000);

  clearInterval(cleanupTimer);

  cleanupTimer=setInterval(
    cleanupOldPresence,
    60000
  );

}

async function cleanupOldPresence(){

  /*
    This client-side cleanup is intentionally conservative.
    Online users are refreshed from chat_users regularly.
  */

  await loadOnlineUsers();

}

async function clearPresence(){

  if(!currentUser || anonymous){

    if(currentUser?.id){

      await sb
        .from("chat_users")
        .delete()
        .eq("id",currentUser.id);

    }

    return;

  }

  await sb
    .from("chat_users")
    .delete()
    .eq("id",currentUser.id);

}

async function loadOnlineUsers(){

  const {data,error}=await sb
    .from("chat_users")
    .select("*");

  if(error){
    console.warn(error.message);
    return;
  }

  const now=Date.now();

  onlineUsers.clear();

  (data||[]).forEach(u=>{

    /*
      chat_users itself doesn't have last_seen in the
      old schema, so current users are refreshed.
      Current session is guaranteed online.
    */

    onlineUsers.set(u.id,{
      ...u,
      _seen:now
    });

  });

  /*
    Make sure current user remains online.
  */

  if(currentUser){

    onlineUsers.set(
      currentUser.id,
      {
        id:currentUser.id,
        nickname:
          currentProfile?.display_name ||
          currentProfile?.username ||
          "Anonymous",
        _seen:now
      }
    );

  }

  renderOnlineUsers();

}

function renderOnlineUsers(){

  const list=$("onlineList");

  if(!list)return;

  list.innerHTML="";

  let count=0;

  for(const [id,u] of onlineUsers){

    if(
      u._seen &&
      Date.now()-u._seen>PRESENCE_TIMEOUT
    )continue;

    count++;

    const profile=profilesCache.get(id);

    const fake={
      id,
      username:profile?.username || u.nickname,
      display_name:
        profile?.display_name ||
        u.nickname,
      avatar_url:profile?.avatar_url || null
    };

    const el=document.createElement("div");

    el.className="online-user";

    el.onclick=()=>openUserProfile(id);

    el.innerHTML=`

      ${avatarHTML(fake,40)}

      <div class="online-name">

        <b>${escapeHTML(fake.display_name)}</b>

        <span>● Online</span>

      </div>

    `;

    list.appendChild(el);

  }

  $("onlineCount").textContent=count;

  if(count===0){

    list.innerHTML=`
      <div style="
        padding:25px 10px;
        text-align:center;
        color:#9aabb6;
        font-size:11px">
        No users online
      </div>
    `;

  }

}

/* =========================================================
   REALTIME
   ========================================================= */

function setupRealtime(){

  if(realtimeChannel){
    sb.removeChannel(realtimeChannel);
  }

  realtimeChannel=sb
    .channel("shadow-main-"+currentUser.id)

    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"messages"
      },
      payload=>{
        handleRealtimeMessage(payload);
      }
    )

    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"chat_users"
      },
      payload=>{
        handlePresenceChange(payload);
      }
    )

    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"friend_requests"
      },
      payload=>{
        handleFriendRealtime(payload);
      }
    )

    .subscribe();

}

function handlePresenceChange(payload){

  const row=payload.new || payload.old;

  if(!row)return;

  if(payload.eventType==="DELETE"){

    onlineUsers.delete(row.id);

  }else{

    onlineUsers.set(row.id,{
      ...row,
      _seen:Date.now()
    });

  }

  renderOnlineUsers();

}

async function handleRealtimeMessage(payload){

  if(payload.eventType!=="INSERT")return;

  const msg=payload.new;

  if(!msg)return;

  /*
    Voice/call signaling MUST be handled before normal chat filter.
  */

  if(msg.message_type==="voice_signal"){

    handleVoiceSignal(msg);

    return;

  }

  if(msg.message_type==="call_signal"){

    handleCallSignal(msg);

    return;

  }

  if(msg.message_type!=="chat")return;

  /*
    Ignore messages older than 5 minutes.
  */

  if(
    Date.now()-new Date(msg.created_at).getTime()
    >FIVE_MIN
  )return;

  /*
    PRIVATE MESSAGE NOTIFICATION
    Only the intended receiver gets it.
  */

  if(
    msg.receiver_id &&
    currentUser &&
    msg.receiver_id===currentUser.id &&
    msg.sender_id!==currentUser.id
  ){

    const senderProfile=
      await getProfile(msg.sender_id);

    const sameChat=
      currentRoom==="private" &&
      currentFriend?.id===msg.sender_id;

    if(!sameChat || document.hidden){

      showPrivateNotification(
        msg,
        senderProfile
      );

    }

  }

  /*
    Display message only if it belongs to current room.
  */

  if(currentRoom==="public" && !msg.receiver_id){

    appendMessage(msg,false);

  }

  if(
    currentRoom==="private" &&
    currentFriend &&
    msg.room===privateRoom(
      currentUser.id,
      currentFriend.id
    )
  ){

    appendMessage(msg,false);

  }

}

/* =========================================================
   MESSAGES
   ========================================================= */

async function loadPublicMessages(){

  if(!currentUser)return;

  currentRoom="public";

  const cutoff=
    new Date(Date.now()-FIVE_MIN).toISOString();

  const {data,error}=await sb
    .from("messages")
    .select("*")
    .eq("room","public")
    .eq("message_type","chat")
    .is("receiver_id",null)
    .gte("created_at",cutoff)
    .order("created_at",{ascending:true});

  if(error){

    showToast("Chat error",error.message);

    return;

  }

  renderMessages(data||[]);

}

async function loadPrivateMessages(friend){

  const room=privateRoom(
    currentUser.id,
    friend.id
  );

  const cutoff=
    new Date(Date.now()-FIVE_MIN).toISOString();

  const {data,error}=await sb
    .from("messages")
    .select("*")
    .eq("room",room)
    .eq("message_type","chat")
    .gte("created_at",cutoff)
    .order("created_at",{ascending:true});

  if(error){

    showToast("Chat error",error.message);

    return;

  }

  renderMessages(data||[]);

}

function renderMessages(messages){

  const box=$("chatMessages");

  box.innerHTML="";

  if(!messages.length){

    box.innerHTML=`
      <div class="empty">
        <span class="icon">${icon("chat")}</span>
        <b>No messages yet</b>
        <div>Start the conversation.</div>
      </div>
    `;

    return;

  }

  messages.forEach(m=>appendMessage(m,true));

  box.scrollTop=box.scrollHeight;

}

async function appendMessage(msg,scroll=true){

  const box=$("chatMessages");

  /*
    Prevent duplicate realtime message.
  */

  if(box.querySelector(`[data-message-id="${msg.id}"]`))return;

  const isMine=
    msg.sender_id===currentUser.id;

  let profile=
    profilesCache.get(msg.sender_id);

  if(!profile){

    profile=await getProfile(msg.sender_id);

  }

  const user={
    id:msg.sender_id,
    username:
      profile?.username ||
      msg.nickname ||
      "User",
    display_name:
      profile?.display_name ||
      msg.nickname ||
      "User",
    avatar_url:profile?.avatar_url || null
  };

  const row=document.createElement("div");

  row.className=
    "message-row"+(isMine?" mine":"");

  row.dataset.messageId=msg.id;

  row.innerHTML=`

    <div onclick="openUserProfile('${escapeAttr(msg.sender_id)}')">
      ${avatarHTML(user,34)}
    </div>

    <div class="message-content">

      <div class="message-sender"
           onclick="openUserProfile('${escapeAttr(msg.sender_id)}')">

        ${escapeHTML(user.display_name)}

      </div>

      <div class="message-bubble">
        ${escapeHTML(msg.message)}
      </div>

      <div class="message-time">
        ${formatTime(msg.created_at)}
      </div>

    </div>

  `;

  box.appendChild(row);

  scheduleMessageRemoval(
    row,
    msg.created_at
  );

  if(scroll){

    box.scrollTop=box.scrollHeight;

  }

}

function scheduleMessageRemoval(el,createdAt){

  const age=
    Date.now()-new Date(createdAt).getTime();

  const remaining=FIVE_MIN-age;

  if(remaining<=0){

    el.remove();

    return;

  }

  setTimeout(()=>{

    el.remove();

  },remaining+100);

}

async function sendMessage(){

  const input=$("messageInput");

  const text=input.value.trim();

  if(!text)return;

  if(!currentUser)return;

  if(
    currentRoom==="private" &&
    !currentFriend
  ){

    showToast(
      "No chat selected",
      "Select a friend first."
    );

    return;

  }

  let room="public";
  let receiver_id=null;

  if(currentRoom==="private"){

    room=privateRoom(
      currentUser.id,
      currentFriend.id
    );

    receiver_id=currentFriend.id;

  }

  const {data,error}=await sb
    .from("messages")
    .insert({
      room,
      sender_id:currentUser.id,
      receiver_id,
      nickname:
        currentProfile?.display_name ||
        currentProfile?.username ||
        "Anonymous",
      message:text,
      message_type:"chat"
    })
    .select()
    .single();

  if(error){

    showToast("Message failed",error.message);

    return;

  }

  input.value="";
  input.style.height="auto";

  /*
    Supabase realtime normally returns this message too,
    but showing immediately makes the interface feel instant.
  */

  appendMessage(data,true);

}

function handleMessageKey(e){

  if(e.key==="Enter" && !e.shiftKey){

    e.preventDefault();

    sendMessage();

  }

}

function autoResize(el){

  el.style.height="auto";

  el.style.height=
    Math.min(el.scrollHeight,110)+"px";

}

/* =========================================================
   PRIVATE CHAT
   ========================================================= */

function privateRoom(a,b){

  return "private_"+[a,b].sort().join("_");

}

async function openPrivateChat(friend){

  if(!friend)return;

  if(friend.id===currentUser.id){

    showToast("Not allowed","You cannot chat with yourself.");

    return;

  }

  const friendCheck=await isFriend(friend.id);

  if(!friendCheck){

    openUserProfile(friend.id);

    showToast(
      "Friends only",
      "Send a friend request first."
    );

    return;

  }

  currentRoom="private";

  currentFriend=friend;

  setHeaderPrivate(friend);

  await loadPrivateMessages(friend);

  $("messageInput").focus();

  mobileGo("home");

}

function openCurrentChatProfile(){

  if(currentRoom==="private" && currentFriend){

    openUserProfile(currentFriend.id);

  }

}

/* =========================================================
   PROFILES
   ========================================================= */

async function getProfile(id){

  if(!id)return null;

  if(profilesCache.has(id)){

    return profilesCache.get(id);

  }

  if(anonymous && id===currentUser.id){

    profilesCache.set(id,currentProfile);

    return currentProfile;

  }

  const {data}=await sb
    .from("profiles")
    .select("*")
    .eq("id",id)
    .maybeSingle();

  if(data){

    profilesCache.set(id,data);

  }

  return data;

}

async function openUserProfile(id){

  if(!id)return;

  if(id===currentUser.id){

    openSettings();

    return;

  }

  const profile=await getProfile(id);

  const online=onlineUsers.has(id);

  if(!profile){

    showToast(
      "Profile unavailable",
      "This user profile could not be loaded."
    );

    return;

  }

  const friend=await isFriend(id);
  const outgoing=await requestExists(
    currentUser.id,
    id,
    "pending"
  );

  const incoming=await requestExists(
    id,
    currentUser.id,
    "pending"
  );

  let actions="";

  if(friend){

    actions=`

      <button class="action-btn"
              onclick="profileChat('${escapeAttr(id)}')">
        <span class="icon">${icon("chat")}</span>
        Chat
      </button>

      <button class="action-btn danger"
              onclick="unfriend('${escapeAttr(id)}')">
        <span class="icon">${icon("users")}</span>
        Unfriend
      </button>

      <button class="action-btn danger"
              onclick="blockUser('${escapeAttr(id)}')">
        <span class="icon">${icon("block")}</span>
        Block
      </button>

      <button class="action-btn dark"
              onclick="closeModal('profileOverlay')">
        Close
      </button>

    `;

  }else if(incoming){

    actions=`

      <button class="action-btn success"
              onclick="acceptRequestFromProfile('${escapeAttr(id)}')">
        <span class="icon">${icon("check")}</span>
        Accept Request
      </button>

      <button class="action-btn danger"
              onclick="rejectRequestFromProfile('${escapeAttr(id)}')">
        <span class="icon">${icon("x")}</span>
        Reject
      </button>

    `;

  }else if(outgoing){

    actions=`

      <button class="action-btn dark">
        Request Sent
      </button>

      <button class="action-btn danger"
              onclick="cancelRequest('${escapeAttr(id)}')">
        Cancel
      </button>

    `;

  }else{

    actions=`

      <button class="action-btn"
              onclick="sendFriendRequest('${escapeAttr(id)}')">
        <span class="icon">${icon("plus")}</span>
        Add Friend
      </button>

      <button class="action-btn dark"
              onclick="closeModal('profileOverlay')">
        Close
      </button>

    `;

  }

  $("profileContent").innerHTML=`

    <div class="profile-cover">

      ${avatarHTML(profile,85)}

      <div class="profile-name">
        ${escapeHTML(profile.display_name || "User")}
      </div>

      <div class="profile-username">
        @${escapeHTML(profile.username || profile.id.slice(0,8))}
      </div>

      <div style="
        margin-top:6px;
        font-size:10px;
        color:${online ? "#23aa72":"#94a6b2"}">
        ● ${online ? "Online now":"Offline"}
      </div>

      <div class="profile-bio">
        ${escapeHTML(profile.bio || "No bio added.")}
      </div>

      <div class="profile-actions">
        ${actions}
      </div>

    </div>
  `;

  $("profileOverlay").style.display="flex";

}

async function profileChat(id){

  closeModal("profileOverlay");

  const p=await getProfile(id);

  if(p){

    openPrivateChat(p);

  }

}

async function isFriend(id){

  if(!currentUser || anonymous)return false;

  const {data,error}=await sb
    .from("friendships")
    .select("id")
    .or(
      `and(user_id.eq.${currentUser.id},friend_id.eq.${id}),and(user_id.eq.${id},friend_id.eq.${currentUser.id})`
    )
    .limit(1);

  if(error){

    /*
      If table is missing, return false instead of breaking app.
    */

    console.warn("Friendship:",error.message);

    return false;

  }

  return !!(data && data.length);

}

async function requestExists(sender,receiver,status){

  if(!currentUser || anonymous)return false;

  const {data,error}=await sb
    .from("friend_requests")
    .select("id")
    .eq("sender_id",sender)
    .eq("receiver_id",receiver)
    .eq("status",status)
    .limit(1);

  if(error)return false;

  return !!(data && data.length);

}

/* =========================================================
   FRIEND REQUESTS
   ========================================================= */

async function sendFriendRequest(id){

  if(anonymous){

    showToast(
      "Create an account",
      "Friend requests require a permanent account."
    );

    return;

  }

  if(id===currentUser.id)return;

  const already=await isFriend(id);

  if(already){

    showToast("Already friends","You can start chatting.");

    return;

  }

  const {error}=await sb
    .from("friend_requests")
    .insert({
      sender_id:currentUser.id,
      receiver_id:id,
      status:"pending"
    });

  if(error){

    if(
      String(error.message||"")
      .toLowerCase()
      .includes("duplicate")
    ){

      showToast(
        "Already sent",
        "Friend request is already pending."
      );

    }else{

      showToast(
        "Request failed",
        error.message
      );

    }

    return;

  }

  closeModal("profileOverlay");

  showToast(
    "Request sent",
    "Friend request has been sent."
  );

}

async function acceptRequestFromProfile(senderId){

  const {data,error}=await sb
    .from("friend_requests")
    .select("*")
    .eq("sender_id",senderId)
    .eq("receiver_id",currentUser.id)
    .eq("status","pending")
    .maybeSingle();

  if(error || !data){

    showToast(
      "Request unavailable",
      "The request may have changed."
    );

    return;

  }

  await acceptRequest(data);

  closeModal("profileOverlay");

}

async function rejectRequestFromProfile(senderId){

  const {data}=await sb
    .from("friend_requests")
    .select("*")
    .eq("sender_id",senderId)
    .eq("receiver_id",currentUser.id)
    .eq("status","pending")
    .maybeSingle();

  if(data){

    await rejectRequest(data);

  }

  closeModal("profileOverlay");

}

async function acceptRequest(req){

  const {error}=await sb
    .from("friend_requests")
    .update({
      status:"accepted"
    })
    .eq("id",req.id);

  if(error){

    showToast("Error",error.message);

    return;

  }

  const rows=[
    {
      user_id:req.sender_id,
      friend_id:req.receiver_id
    },
    {
      user_id:req.receiver_id,
      friend_id:req.sender_id
    }
  ];

  const {error:friendError}=await sb
    .from("friendships")
    .upsert(rows,{
      onConflict:"user_id,friend_id"
    });

  if(friendError){

    showToast(
      "Friendship error",
      friendError.message
    );

    return;

  }

  showToast(
    "Friend added",
    "You can now chat privately."
  );

  loadFriends();

}

async function rejectRequest(req){

  const {error}=await sb
    .from("friend_requests")
    .update({
      status:"rejected"
    })
    .eq("id",req.id);

  if(error){

    showToast("Error",error.message);

    return;

  }

  showToast(
    "Request rejected",
    "Friend request removed."
  );

  loadFriends();

}

async function cancelRequest(id){

  const {error}=await sb
    .from("friend_requests")
    .delete()
    .eq("sender_id",currentUser.id)
    .eq("receiver_id",id)
    .eq("status","pending");

  if(error){

    showToast("Error",error.message);

    return;

  }

  closeModal("profileOverlay");

}

async function unfriend(id){

  if(!confirm("Remove this person from your friends?"))return;

  const {error}=await sb
    .from("friendships")
    .delete()
    .or(
      `and(user_id.eq.${currentUser.id},friend_id.eq.${id}),and(user_id.eq.${id},friend_id.eq.${currentUser.id})`
    );

  if(error){

    showToast("Error",error.message);

    return;

  }

  closeModal("profileOverlay");

  if(
    currentFriend &&
    currentFriend.id===id
  ){

    currentFriend=null;
    currentRoom="public";
    setHeaderPublic();
    loadPublicMessages();

  }

  showToast(
    "Friend removed",
    "You are no longer friends."
  );

}

async function blockUser(id){

  if(!confirm("Block this user?"))return;

  const {error}=await sb
    .from("blocks")
    .insert({
      blocker_id:currentUser.id,
      blocked_id:id
    });

  if(error){

    if(
      String(error.message||"")
      .toLowerCase()
      .includes("duplicate")
    ){

      showToast("Already blocked","");

    }else{

      showToast("Block failed",error.message);

    }

    return;

  }

  await unfriend(id);

  showToast(
    "User blocked",
    "You will not start chats with this user."
  );

}

async function unblockUser(id){

  const {error}=await sb
    .from("blocks")
    .delete()
    .eq("blocker_id",currentUser.id)
    .eq("blocked_id",id);

  if(error){

    showToast("Error",error.message);

    return;

  }

  closeModal("profileOverlay");

  showToast(
    "Unblocked",

    .from("profiles")
    .select("*")

async function saveProfile(){

  if(anonymous)return;

  const username=$("profileUsername").value.trim();
  const display=$("profileDisplay").value.trim();
  const bio=$("profileBio").value.trim();

  if(!username || !display){

    );

  const {data,error}=await sb
    .from("profiles")
    .update({
      username,
      display_name:display,
      bio
    })
    .eq("id",currentUser.id)
    .select()
    .single();

  if(error){

    showToast(
      "Profile update failed",
      error.message
    );

  }

  currentProfile=data;

    currentUser.id,

  );

async function uploadAvatar(event){

  if(anonymous)return;

  const file=event.target.files?.[0];

  if(!file)return;

  /*
    MAX 200 KB
  */

  if(file.size>200*1024){

    showToast(
      "Image too large",
      "Profile picture must be 200 KB or smaller."
    );

    event.target.value="";

    return;

  }

  if(!file.type.startsWith("image/")){

    showToast(
      "Invalid file",
      "Please choose an image."
    );

    return;

  }

  const path=
    `${currentUser.id}.avatar`;

  const {error}=await sb
    .storage
    .from("avatars")
    .upload(
      path,
      file,
      {
        upsert:true,
        contentType:file.type,
        cacheControl:"3600"
      }
    );

  if(error){

    showToast(
      "Upload failed",
      error.message
    );

    return;

  }

  const {data:publicData}=
    sb.storage
      .from("avatars")
      .getPublicUrl(path);

  const avatarUrl=
    publicData.publicUrl+
    "?v="+Date.now();

  const {error:updateError}=await sb
    .from("profiles")
    .update({
      avatar_url:avatarUrl
    })
    .eq("id",currentUser.id);

  if(updateError){

    showToast(
      "Profile update failed",
      updateError.message
    );

    return;

  }

  currentProfile.avatar_url=avatarUrl;

  profilesCache.set(
    currentUser.id,
    currentProfile
  );

  openSettings();

  showToast(
    "Photo updated",
    "Your profile picture has been changed."
  );

}

async function requestNotificationPermission(){

  if(!("Notification" in window)){

    showToast(
      "Notifications unavailable",
      "This browser does not support notifications."
    );

    return;

  }

  if(Notification.permission==="granted"){

    showToast(
      "Notifications enabled",
      "Private message alerts are active."
    );

    return;

  }

  if(Notification.permission!=="denied"){

    const permission=
      await Notification.requestPermission();

    if(permission==="granted"){

      showToast(
        "Notifications enabled",
        "You will receive private message alerts."
      );

    }

  }else{

    showToast(
      "Notifications blocked",
      "Enable notifications from browser settings."
    );

  }

}

async function showPrivateNotification(msg,sender){

  unreadPrivate++;

  notifications.unshift({
    type:"message",

    name:
      sender?.display_name ||
      msg.nickname ||
      "Someone",
    message:msg.message,

  });

  notifications=
    notifications.slice(0,30);

  updateNotificationUI();

  const name=
    sender?.display_name ||
    msg.nickname ||
    "Someone";

  showToast(
    name,
    msg.message,
    sender
  );

  /*
    Browser notification goes ONLY to the receiver because
    this code runs only when receiver_id === currentUser.id.
  */

  if(
    "Notification" in window &&
    Notification.permission==="granted"
  ){

    try{

      const n=new Notification(
        "New message from "+name,
        {
          body:msg.message.slice(0,120),
          icon:
            sender?.avatar_url ||
            undefined,
          tag:"private-"+msg.sender_id

      n.onclick=async()=>{

        window.focus();

        const p=await getProfile(msg.sender_id);

        if(p){

          openPrivateChat(p);

        n.close();

      };

    }catch(e){}

  }

}

async function toggleVoice(){

  if(voiceActive){

    await leaveVoice();

    return;

  }

  try{

    voiceStream=
      await navigator.mediaDevices.getUserMedia({
        audio:true,
        video:false
      });

  }catch(e){

    showToast(
      "Microphone unavailable",
      "Please allow microphone access."
    );

    return;

  }

  voiceActive=true;

  $("voiceStatus").textContent=
    "You are connected to the voice room.";

  $("voiceToggleBtn").textContent=
    "Leave Voice Room";

  await loadOnlineUsers();

  for(const [id] of onlineUsers){

    if(id===currentUser.id)continue;

    /*
      Deterministic offerer prevents both peers from making offers.
    */

    if(currentUser.id < id){

      await createVoiceOffer(id);

    }

  }

}

async function leaveVoice(){

  if(!voiceActive){

    closeModal("voiceOverlay");

    return;

  }

  for(const [id] of voicePeers){

    await sendVoiceSignal(
      "voice_leave",
      {},
      id
    );

  }

  voicePeers.forEach(pc=>pc.close());

  voicePeers.clear();

  voiceIceQueue.clear();

  if(voiceStream){

    voiceStream.getTracks().forEach(
      t=>t.stop()
    );

  }

  voiceStream=null;
  voiceActive=false;

  $("voiceStatus").textContent=
    "Join the live voice room.";

  $("voiceToggleBtn").textContent=
    "Join Voice Room";

  closeModal("voiceOverlay");

}

async function createVoicePeer(remoteId){

  if(voicePeers.has(remoteId)){

    return voicePeers.get(remoteId);

  }

  if(!voiceStream)return null;

  const pc=new RTCPeerConnection({

    iceServers:[
      {
        urls:"stun:stun.l.google.com:19302"
      }
    ]

  });

  voicePeers.set(remoteId,pc);

  voiceIceQueue.set(
    remoteId,
    []
  );

  voiceStream
    .getTracks()
    .forEach(track=>{
      pc.addTrack(track,voiceStream);
    });

  pc.onicecandidate=e=>{

    if(e.candidate){

      sendVoiceSignal(
        "ice",
        e.candidate,
        remoteId
      );

    }

  };

  pc.ontrack=e=>{

    let audio=document.getElementById(
      "voice-audio-"+remoteId
    );

    if(!audio){

      audio=document.createElement("audio");

      audio.id=
        "voice-audio-"+remoteId;

      audio.autoplay=true;

      audio.playsInline=true;

      document.body.appendChild(audio);

    }

    audio.srcObject=e.streams[0];

    audio.play().catch(()=>{});

  };

  pc.onconnectionstatechange=()=>{

    if(
      ["failed","closed","disconnected"]
      .includes(pc.connectionState)
    ){

      pc.close();

      voicePeers.delete(remoteId);

    }

  };

  return pc;

}

async function createVoiceOffer(remoteId){

  const pc=
    await createVoicePeer(remoteId);

  if(!pc)return;

  if(pc.signalingState!=="stable")return;

  const offer=
    await pc.createOffer();

  await pc.setLocalDescription(offer);

  await sendVoiceSignal(
    "offer",
    offer,
    remoteId
  );

}

async function sendVoiceSignal(kind,data,to){

  if(!currentUser)return;

  await sb
    .from("messages")
    .insert({
      room:"voice",
      sender_id:currentUser.id,
      receiver_id:to,
      nickname:
        currentProfile?.display_name ||
        currentProfile?.username ||
        "Anonymous",
      message:JSON.stringify({
        kind,
        data,
        from:currentUser.id,
        to
      }),
      message_type:"voice_signal"
    });

}

async function handleVoiceSignal(msg){

  if(
    !currentUser ||
    msg.receiver_id!==currentUser.id
  )return;

  let signal;

  try{

    signal=JSON.parse(msg.message);

  }catch(e){

    return;

  }

  const from=signal.from;

  if(!from || from===currentUser.id)return;

  if(signal.kind==="voice_join"){

    if(voiceActive && currentUser.id<from){

      await createVoiceOffer(from);

    }

    return;

  }

  if(!voiceActive)return;

  if(signal.kind==="offer"){

    const pc=
      await createVoicePeer(from);

    if(!pc)return;

    await pc.setRemoteDescription(
      new RTCSessionDescription(signal.data)
    );

    await applyVoiceIce(from);

    const answer=
      await pc.createAnswer();

    await pc.setLocalDescription(answer);

    await sendVoiceSignal(
      "answer",
      answer,
      from
    );

  }

  else if(signal.kind==="answer"){

    const pc=
      voicePeers.get(from);

    if(!pc)return;

    await pc.setRemoteDescription(
      new RTCSessionDescription(signal.data)
    );

    await applyVoiceIce(from);

  }

  else if(signal.kind==="ice"){

    const pc=
      voicePeers.get(from);

    if(
      !pc ||
      !pc.remoteDescription
    ){

      if(!voiceIceQueue.has(from))
        voiceIceQueue.set(from,[]);

      voiceIceQueue
        .get(from)
        .push(signal.data);

    }else{

      try{

        await pc.addIceCandidate(
          new RTCIceCandidate(signal.data)
        );

      }catch(e){}

    }

  }

  else if(signal.kind==="voice_leave"){

    const pc=voicePeers.get(from);

    if(pc)pc.close();

    voicePeers.delete(from);

    voiceIceQueue.delete(from);

  }

}

async function applyVoiceIce(id){

  const pc=voicePeers.get(id);

  const queue=voiceIceQueue.get(id)||[];

  if(!pc)return;

  for(const c of queue){

    try{

      await pc.addIceCandidate(
        new RTCIceCandidate(c)
      );

    }catch(e){}

  }

  voiceIceQueue.set(id,[]);

}

/* =========================================================
   PRIVATE CALLS
   ========================================================= */

async function startPrivateCall(){

  if(
    currentRoom!=="private" ||
    !currentFriend
  ){

    showToast(
      "No private chat",
      "Open a friend's chat first."
    );

    return;

  }

  if(callState.active)return;

  const blocked=await isBlocked(currentFriend.id);

  if(blocked){

    showToast(
      "Blocked",
      "This user is blocked."
    );

    return;

  }

  callState={
    active:true,
    remoteId:currentFriend.id,
    remoteProfile:currentFriend,
    role:"caller",
    pc:null,
    localStream:null,
    status:"Calling..."
  };

  showCallUI(
    currentFriend,
    "Calling...",
    false
  );

  await sendCallSignal(
    "ring",
    {}
  );

}

async function sendCallSignal(kind,data={}){

  if(!callState.remoteId)return;

  const room=
    "call_"+[
      currentUser.id,
      callState.remoteId
    ].sort().join("_");

  await sb
    .from("messages")
    .insert({
      room,
      sender_id:currentUser.id,
      receiver_id:callState.remoteId,
      nickname:
        currentProfile?.display_name ||
        "User",
      message:JSON.stringify({
        kind,
        data,
        from:currentUser.id,
        to:callState.remoteId
      }),
      message_type:"call_signal"
    });

}

function showCallUI(profile,status,incoming){

  $("callOverlay").style.display="flex";

  $("callName").textContent=
    profile?.display_name ||
    profile?.username ||
    "User";

  $("callStatus").textContent=status;

  $("callAvatar").innerHTML=
    avatarHTML(profile,105);

  $("callAcceptBtn").style.display=
    incoming ? "flex":"none";

}

async function handleCallSignal(msg){

  if(
    !currentUser ||
    msg.receiver_id!==currentUser.id
  )return;

  let signal;

  try{

    signal=JSON.parse(msg.message);

  }catch(e){

    return;

  }

  const from=signal.from;

  if(!from)return;

  if(signal.kind==="ring"){

    if(callState.active)return;

    const p=await getProfile(from);

    callState={
      active:true,
      remoteId:from,
      remoteProfile:p,
      role:"callee",
      pc:null,
      localStream:null,
      status:"Incoming call"
    };

    showCallUI(
      p,
      "Incoming private call",
      true
    );

    return;

  }

  if(
    !callState.active ||
    callState.remoteId!==from
  )return;

  if(signal.kind==="accept"){

    $("callAcceptBtn").style.display="none";

    $("callStatus").textContent=
      "Connecting...";

    await prepareCallMedia();

    await createCallOffer();

  }

  else if(signal.kind==="offer"){

    $("callAcceptBtn").style.display="none";

    $("callStatus").textContent=
      "Connecting...";

    await prepareCallMedia();

    const pc=
      await createCallPeer();

    await pc.setRemoteDescription(
      new RTCSessionDescription(signal.data)
    );

    await applyCallIce();

    const answer=
      await pc.createAnswer();

    await pc.setLocalDescription(answer);

    await sendCallSignal(
      "answer",
      answer
    );

  }

  else if(signal.kind==="answer"){

    const pc=callState.pc;

    if(!pc)return;

    await pc.setRemoteDescription(
      new RTCSessionDescription(signal.data)
    );

    await applyCallIce();

    $("callStatus").textContent=
      "Connected";

  }

  else if(signal.kind==="ice"){

    const pc=callState.pc;

    if(!pc || !pc.remoteDescription){

      if(!callState.iceQueue)
        callState.iceQueue=[];

      callState.iceQueue.push(signal.data);

    }else{

      try{

        await pc.addIceCandidate(
          new RTCIceCandidate(signal.data)
        );

      }catch(e){}

    }

  }

  else if(signal.kind==="hangup"){

    endCall(false);

  }

}

async function acceptCall(){

  if(
    !callState.active ||
    callState.role!=="callee"
  )return;

  $("callAcceptBtn").style.display="none";

  $("callStatus").textContent=
    "Connecting...";

  try{

    await prepareCallMedia();

    await sendCallSignal("accept",{});

  }catch(e){

    endCall(true);

  }

}

async function prepareCallMedia(){

  if(callState.localStream)return;

  callState.localStream=
    await navigator.mediaDevices.getUserMedia({
      audio:true,
      video:false
    });

}

async function createCallPeer(){

  if(callState.pc)return callState.pc;

  const pc=new RTCPeerConnection({

    iceServers:[
      {
        urls:"stun:stun.l.google.com:19302"
      }
    ]

  });

  callState.pc=pc;

  callState.iceQueue=
    callState.iceQueue || [];

  callState.localStream
    .getTracks()
    .forEach(track=>{
      pc.addTrack(
        track,
        callState.localStream
      );
    });

  pc.onicecandidate=e=>{

    if(e.candidate){

      sendCallSignal(
        "ice",
        e.candidate
      );

    }

  };

  pc.ontrack=e=>{

    let audio=$("privateCallAudio");

    if(!audio){

      audio=document.createElement("audio");

      audio.id="privateCallAudio";

      audio.autoplay=true;
      audio.playsInline=true;

      document.body.appendChild(audio);

    }

    audio.srcObject=e.streams[0];

    audio.play().catch(()=>{});

  };

  pc.onconnectionstatechange=()=>{

    if(
      pc.connectionState==="connected"
    ){

      $("callStatus").textContent=
        "Connected";

    }

    if(
      ["failed","disconnected","closed"]
      .includes(pc.connectionState)
    ){

      $("callStatus").textContent=
        "Call ended";

    }

  };

  return pc;

}

async function createCallOffer(){

  const pc=
    await createCallPeer();

  const offer=
    await pc.createOffer();

  await pc.setLocalDescription(offer);

  await sendCallSignal(
    "offer",
    offer
  );

}

async function applyCallIce(){

  const pc=callState.pc;

  const queue=callState.iceQueue||[];

  if(!pc)return;

  for(const c of queue){

    try{

      await pc.addIceCandidate(
        new RTCIceCandidate(c)
      );

    }catch(e){}

  }

  callState.iceQueue=[];

}

async function endCall(sendSignal=true){

  if(
    sendSignal &&
    callState.active &&
    callState.remoteId
  ){

    await sendCallSignal(
      "hangup",
      {}
    );

  }

  if(callState.pc){

    callState.pc.close();

  }

  if(callState.localStream){

    callState.localStream
      .getTracks()
      .forEach(t=>t.stop());

  }

  const audio=$("privateCallAudio");

  if(audio){

    audio.srcObject=null;
    audio.remove();

  }

  callState={
    active:false,
    remoteId:null,
    remoteProfile:null,
    role:null,
    pc:null,
    localStream:null,
    status:null,
    iceQueue:[]
  };

  $("callOverlay").style.display="none";

}

/* =========================================================
   BLOCK CHECK
   ========================================================= */

async function isBlocked(id){

  if(!currentUser || anonymous)return false;

  const {data}=await sb
    .from("blocks")
    .select("id")
    .eq("blocker_id",currentUser.id)
    .eq("blocked_id",id)
    .limit(1);

  return !!(data && data.length);

}

/* =========================================================
   LOGOUT
   ========================================================= */

async function logout(){

  await clearPresence();

  await sb.auth.signOut();

}

async function logoutAnonymous(){

  await clearPresence();

  localStorage.removeItem("shadow_anon_id");
  localStorage.removeItem("shadow_anon_name");

  currentUser=null;
  currentProfile=null;
  anonymous=false;

  $("app").innerHTML=authHTML();

  setIcons();

  showLogin();

}

/* =========================================================
   HELPERS
   ========================================================= */

function avatarHTML(profile,size=40){

  const name=
    profile?.display_name ||
    profile?.username ||
    "U";

  if(profile?.avatar_url){

    return `
      <div class="avatar"
           style="width:${size}px;height:${size}px"
           onclick="event.stopPropagation()">

        <img src="${escapeAttr(profile.avatar_url)}">

        ${
          onlineUsers.has(profile.id)
          ? `<span class="online-dot"></span>`
          : ""
        }

      </div>
    `;

  }

  return `
    <div class="avatar"
         style="width:${size}px;height:${size}px"
         onclick="event.stopPropagation()">

      ${escapeHTML(initials(name))}

      ${
        onlineUsers.has(profile?.id)
        ? `<span class="online-dot"></span>`
        : ""
      }

    </div>
  `;

}

function initials(name){

  return String(name||"U")
    .split(/\s+/)
    .filter(Boolean)
    .slice(0,2)
    .map(x=>x[0])
    .join("")
    .toUpperCase();

}

function formatTime(date){

  return new Date(date)
    .toLocaleTimeString(
      [],
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

}

function escapeHTML(str){

  return String(str??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

function escapeAttr(str){

  return escapeHTML(str)
    .replaceAll("`","&#096;");

}

function showToast(title,message,profile=null){

  const box=$("toastContainer");

  const el=document.createElement("div");

  el.className="toast";

  el.innerHTML=`

    ${
      profile
      ? avatarHTML(profile,38)
      : `
        <div class="feature-icon"
             style="width:38px;height:38px">
          ${icon("bell")}
        </div>
      `
    }

    <div class="toast-text">

      <b>${escapeHTML(title)}</b>

      <span>
        ${escapeHTML(message || "")}
      </span>

    </div>

  `;

  box.appendChild(el);

  setTimeout(()=>{

    el.style.opacity="0";
    el.style.transform="translateX(30px)";

    setTimeout(
      ()=>el.remove(),
      250
    );

  },4500);

}

function closeModal(id){

  const el=$(id);

  if(el)el.style.display="none";

}

    if(!document.hidden){

      if(currentRoom==="public"){

        loadPublicMessages();

      }else if(
        currentRoom==="private" &&
        currentFriend
      ){

        loadPrivateMessages(currentFriend);

      }

      loadOnlineUsers();

    }
  }
);

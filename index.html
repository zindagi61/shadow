<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Shadow Chat Daanians</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
 --blue:#168ce8;
 --blue2:#eaf6ff;
 --blue3:#d8efff;
 --text:#17202a;
 --muted:#718096;
 --border:#e6edf3;
 --white:#fff;
 --danger:#ef4444;
 --green:#16a34a;
 --shadow:0 8px 30px rgba(20,100,160,.10);
}

*{
 box-sizing:border-box;
 margin:0;
 padding:0;
}

html,body{
 width:100%;
 height:100%;
 overflow:hidden;
 font-family:Arial,Helvetica,sans-serif;
 background:#f6fbff;
 color:var(--text);
}

button,input,textarea{
 font:inherit;
}

button{
 cursor:pointer;
 border:0;
}

.hidden{
 display:none!important;
}

/* LOGIN */

#authScreen{
 width:100%;
 height:100dvh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
 background:
 radial-gradient(circle at top left,#dff3ff,transparent 40%),
 radial-gradient(circle at bottom right,#eaf7ff,transparent 40%),
 #f8fcff;
}

.authBox{
 width:min(430px,100%);
 background:white;
 border:1px solid var(--border);
 border-radius:28px;
 padding:32px;
 box-shadow:var(--shadow);
}

.logoBig{
 width:82px;
 height:82px;
 border-radius:24px;
 background:linear-gradient(135deg,#168ce8,#65c7ff);
 display:flex;
 align-items:center;
 justify-content:center;
 margin:0 auto 18px;
 box-shadow:0 12px 28px rgba(22,140,232,.25);
}

.logoBig svg{
 width:60px;
 height:60px;
}

.authTitle{
 text-align:center;
 font-size:26px;
 font-weight:800;
}

.authSub{
 text-align:center;
 color:var(--muted);
 margin:8px 0 24px;
}

.field{
 margin-bottom:13px;
}

.field label{
 display:block;
 font-size:13px;
 font-weight:700;
 margin-bottom:6px;
}

.field input,
.field textarea{
 width:100%;
 padding:13px 14px;
 border:1px solid var(--border);
 border-radius:13px;
 outline:none;
 background:#fbfdff;
}

.field input:focus,
.field textarea:focus{
 border-color:var(--blue);
 box-shadow:0 0 0 3px rgba(22,140,232,.10);
}

.primary{
 width:100%;
 padding:13px;
 border-radius:13px;
 background:var(--blue);
 color:white;
 font-weight:700;
 margin-top:4px;
}

.secondary{
 width:100%;
 padding:13px;
 border-radius:13px;
 background:var(--blue2);
 color:var(--blue);
 font-weight:700;
 margin-top:10px;
}

.authSwitch{
 text-align:center;
 margin-top:16px;
 color:var(--muted);
 font-size:14px;
}

.authSwitch span{
 color:var(--blue);
 font-weight:700;
 cursor:pointer;
}

/* APP */

#app{
 width:100%;
 height:100dvh;
 display:flex;
 flex-direction:column;
}

.topbar{
 height:64px;
 flex:none;
 background:white;
 border-bottom:1px solid var(--border);
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 18px;
 z-index:50;
}

.brand{
 display:flex;
 align-items:center;
 gap:10px;
 font-weight:800;
 color:#123;
}

.brandLogo{
 width:42px;
 height:42px;
 border-radius:13px;
 background:var(--blue);
 display:flex;
 align-items:center;
 justify-content:center;
}

.brandLogo svg{
 width:32px;
 height:32px;
}

.topActions{
 display:flex;
 align-items:center;
 gap:8px;
}

.iconBtn{
 width:40px;
 height:40px;
 border-radius:12px;
 background:#f1f8fd;
 color:var(--blue);
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:19px;
 position:relative;
}

.badge{
 position:absolute;
 top:-3px;
 right:-3px;
 min-width:17px;
 height:17px;
 border-radius:50%;
 background:#ef4444;
 color:white;
 font-size:10px;
 display:flex;
 align-items:center;
 justify-content:center;
 font-weight:700;
}

.layout{
 flex:1;
 min-height:0;
 display:grid;
 grid-template-columns:280px minmax(0,1fr) 300px;
}

/* SIDEBAR */

.sidebar{
 background:white;
 border-right:1px solid var(--border);
 overflow:auto;
 padding:15px;
}

.sideTitle{
 font-size:13px;
 font-weight:800;
 color:var(--muted);
 margin:7px 5px 10px;
 text-transform:uppercase;
 letter-spacing:.5px;
}

.sideBtn{
 width:100%;
 padding:12px;
 border-radius:13px;
 background:white;
 display:flex;
 align-items:center;
 gap:10px;
 text-align:left;
 margin-bottom:5px;
}

.sideBtn:hover{
 background:var(--blue2);
}

.sideBtn.active{
 background:var(--blue2);
 color:var(--blue);
 font-weight:700;
}

.friendItem{
 display:flex;
 align-items:center;
 gap:10px;
 padding:9px;
 border-radius:13px;
 cursor:pointer;
}

.friendItem:hover{
 background:var(--blue2);
}

.avatar{
 width:40px;
 height:40px;
 border-radius:50%;
 background:linear-gradient(135deg,#168ce8,#8ed7ff);
 color:white;
 display:flex;
 align-items:center;
 justify-content:center;
 font-weight:800;
 overflow:hidden;
 flex:none;
}

.avatar img{
 width:100%;
 height:100%;
 object-fit:cover;
}

.avatar.small{
 width:34px;
 height:34px;
 font-size:12px;
}

.avatar.tiny{
 width:30px;
 height:30px;
 font-size:11px;
}

.friendText{
 min-width:0;
 flex:1;
}

.friendName{
 font-weight:700;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}

.friendUser{
 color:var(--muted);
 font-size:11px;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}

/* CENTER */

.center{
 min-width:0;
 display:flex;
 flex-direction:column;
 background:#f8fcff;
}

.chatHead{
 height:64px;
 flex:none;
 background:white;
 border-bottom:1px solid var(--border);
 display:flex;
 align-items:center;
 padding:0 16px;
 gap:10px;
}

.chatHeadInfo{
 flex:1;
 min-width:0;
}

.chatHeadName{
 font-weight:800;
}

.chatHeadStatus{
 font-size:12px;
 color:var(--green);
}

.messages{
 flex:1;
 overflow:auto;
 padding:18px;
}

.message{
 display:flex;
 gap:8px;
 margin-bottom:13px;
 align-items:flex-end;
}

.message.mine{
 flex-direction:row-reverse;
}

.msgBody{
 max-width:min(70%,600px);
}

.msgBubble{
 background:white;
 border:1px solid var(--border);
 padding:10px 13px;
 border-radius:16px 16px 16px 4px;
 box-shadow:0 3px 12px rgba(0,0,0,.03);
 word-break:break-word;
}

.message.mine .msgBubble{
 background:#168ce8;
 color:white;
 border-radius:16px 16px 4px 16px;
 border:0;
}

.msgMeta{
 font-size:10px;
 color:#8a98a8;
 margin-top:4px;
 padding:0 4px;
}

.message.mine .msgMeta{
 text-align:right;
}

.unsent{
 color:#98a2ad;
 font-style:italic;
 background:#f1f3f5;
 border-radius:14px;
 padding:10px 13px;
}

.unsent strong{
 color:#6b7280;
}

.composer{
 flex:none;
 background:white;
 border-top:1px solid var(--border);
 padding:10px;
 display:flex;
 gap:8px;
}

.composer input{
 flex:1;
 min-width:0;
 border:1px solid var(--border);
 border-radius:14px;
 padding:12px 14px;
 outline:none;
}

.sendBtn{
 width:46px;
 border-radius:13px;
 background:var(--blue);
 color:white;
 font-size:18px;
}

/* RIGHT BAR */

.rightbar{
 background:white;
 border-left:1px solid var(--border);
 overflow:auto;
 padding:15px;
}

.panel{
 background:#fbfdff;
 border:1px solid var(--border);
 border-radius:18px;
 padding:14px;
 margin-bottom:12px;
}

.panelTitle{
 font-weight:800;
 margin-bottom:10px;
}

.profileCard{
 text-align:center;
}

.profileCard .avatar{
 margin:auto;
 width:76px;
 height:76px;
 font-size:22px;
}

.profileCard h3{
 margin-top:9px;
}

.profileCard p{
 color:var(--muted);
 font-size:12px;
 margin-top:3px;
}

.actionBtn{
 width:100%;
 padding:10px;
 border-radius:11px;
 background:var(--blue2);
 color:var(--blue);
 font-weight:700;
 margin-top:7px;
}

.actionBtn.danger{
 background:#fff0f0;
 color:var(--danger);
}

/* VOICE ROOM */

.voiceRoom{
 background:linear-gradient(145deg,#eaf7ff,#ffffff);
 border:1px solid #cdeaff;
 border-radius:18px;
 padding:14px;
 margin-bottom:12px;
}

.voiceHeader{
 display:flex;
 align-items:center;
 justify-content:space-between;
 margin-bottom:10px;
}

.voiceTitle{
 font-weight:800;
 color:#126fae;
}

.voiceStatus{
 font-size:11px;
 color:var(--green);
}

.voiceUsers{
 display:flex;
 flex-direction:column;
 gap:7px;
 max-height:190px;
 overflow:auto;
}

.voiceUser{
 display:flex;
 align-items:center;
 gap:8px;
 background:white;
 padding:7px;
 border-radius:11px;
}

.voiceUserName{
 flex:1;
 font-size:13px;
 font-weight:700;
}

.micState{
 font-size:16px;
}

.joinVoice{
 width:100%;
 padding:11px;
 border-radius:12px;
 background:var(--blue);
 color:white;
 font-weight:800;
 margin-top:10px;
}

.leaveVoice{
 width:100%;
 padding:11px;
 border-radius:12px;
 background:#fff0f0;
 color:var(--danger);
 font-weight:800;
 margin-top:10px;
}

/* MODAL */

.modal{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.35);
 display:flex;
 align-items:center;
 justify-content:center;
 padding:18px;
 z-index:200;
}

.modalBox{
 width:min(420px,100%);
 max-height:90dvh;
 overflow:auto;
 background:white;
 border-radius:22px;
 padding:20px;
 box-shadow:0 20px 70px rgba(0,0,0,.2);
}

.modalHead{
 display:flex;
 align-items:center;
 justify-content:space-between;
 margin-bottom:16px;
}

.closeBtn{
 width:35px;
 height:35px;
 border-radius:10px;
 background:#f1f5f9;
}

.profileBig{
 text-align:center;
}

.profileBig .avatar{
 width:90px;
 height:90px;
 margin:auto;
 font-size:28px;
}

.profileBig h2{
 margin-top:10px;
}

.profileBig p{
 color:var(--muted);
 margin-top:4px;
}

.toast{
 position:fixed;
 right:20px;
 bottom:20px;
 background:#17202a;
 color:white;
 padding:12px 16px;
 border-radius:12px;
 z-index:500;
 box-shadow:var(--shadow);
 max-width:320px;
}

.callBox{
 text-align:center;
}

.callVideo{
 width:100%;
 max-height:50dvh;
 background:#111;
 border-radius:15px;
 object-fit:cover;
}

.callControls{
 display:flex;
 justify-content:center;
 gap:8px;
 margin-top:12px;
}

.callControls button{
 padding:11px 16px;
 border-radius:12px;
 background:var(--blue2);
 color:var(--blue);
 font-weight:700;
}

.callControls .end{
 background:#ffecec;
 color:var(--danger);
}

/* MOBILE */

.mobileNav{
 display:none;
}

@media(max-width:900px){
 .layout{
  grid-template-columns:230px minmax(0,1fr);
 }

 .rightbar{
  display:none;
 }
}

@media(max-width:700px){

 html,body,#app{
  width:100%;
  height:100dvh;
 }

 .topbar{
  height:60px;
  padding:0 10px;
 }

 .brand span{
  font-size:14px;
 }

 .brandLogo{
  width:38px;
  height:38px;
 }

 .layout{
  display:block;
  height:calc(100dvh - 60px - 62px);
 }

 .sidebar{
  display:none;
 }

 .center{
  width:100%;
  height:100%;
 }

 .chatHead{
  height:60px;
  padding:0 10px;
 }

 .messages{
  padding:12px 9px;
 }

 .msgBody{
  max-width:78%;
 }

 .composer{
  padding:7px;
 }

 .mobileNav{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  height:62px;
  flex:none;
  background:white;
  border-top:1px solid var(--border);
  z-index:100;
 }

 .mobileNav button{
  background:white;
  color:#64748b;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  font-size:11px;
 }

 .mobileNav button.active{
  color:var(--blue);
  font-weight:800;
 }

 .mobilePanel{
  position:fixed;
  top:60px;
  bottom:62px;
  left:0;
  right:0;
  background:white;
  z-index:90;
  overflow:auto;
  padding:12px;
 }

 .mobilePanel .rightbar{
  display:block;
  border:0;
  width:100%;
  padding:0;
 }

 .authBox{
  padding:24px;
 }

 .toast{
  left:12px;
  right:12px;
  bottom:74px;
  max-width:none;
 }
}

/* VERY SMALL PHONES */

@media(max-width:380px){

 .brand span{
  display:none;
 }

 .topActions .iconBtn{
  width:36px;
  height:36px;
 }

 .msgBody{
  max-width:82%;
 }

 .avatar{
  width:34px;
  height:34px;
 }
}
</style>
</head>

 </div>
</div>


<!-- APP -->

<div id="app" class="hidden">

 <div class="topbar">

  <div class="brand">

   <div class="brandLogo">
    <svg viewBox="0 0 100 100">
     <path
      d="M20 46C20 25 35 12 50 12C67 12 80 26 80 46V78C80 83 75 86 71 82L63 75L55 83L47 75L39 83L31 75L23 82C19 85 20 77 20 78Z"
      fill="white"/>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://vqpjdhbdmcxhkcpghsrp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_4wZB1Cg1UJpOGpeegkDVWA_ddtCQ9FZ";

const sb = supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY,
 {
  auth:{
   persistSession:true,
   autoRefreshToken:true,
   detectSessionInUrl:true
  }
 }
);


/* =========================================================
   GLOBAL
========================================================= */

let currentUser=null;
let currentProfile=null;
let currentRoom="public";
let currentFriend=null;

let profilesCache={};
let friends=[];
let notifications=[];

let realtimeChannel=null;
let friendChannel=null;
let callChannel=null;


/* VOICE */

let voiceJoined=false;
let voiceMuted=false;
let voiceChannel=null;
let voiceStream=null;
let voicePeers={};


/* CALL */

let callPeer=null;
let callStream=null;
let callFriend=null;
let callType=null;


/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(str=""){
 return String(str)
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}


function initials(name="User"){
 return name
  .trim()
  .split(/\s+/)
  .slice(0,2)
  .map(x=>x[0])
  .join("")
  .toUpperCase() || "U";
}


function avatarHtml(profile,size=""){
 if(profile?.avatar_url){
  return `
   <div class="avatar ${size}">
    <img src="${escapeHtml(profile.avatar_url)}">
   </div>`;
 }

 return `

   ${escapeHtml(initials(

   ))}

}


function showToast(title,msg=""){
 const t=document.getElementById("toast");

 t.innerHTML=`
  <strong>${escapeHtml(title)}</strong>
  ${msg?`<div style="font-size:12px;margin-top:3px">
   ${escapeHtml(msg)}
  </div>`:""}
 `;

 t.classList.remove("hidden");

 clearTimeout(window.toastTimer);

 window.toastTimer=setTimeout(()=>{
  t.classList.add("hidden");
 },3500);
}


function formatTime(time){
 return new Date(time).toLocaleTimeString([],{
  hour:"2-digit",
  minute:"2-digit"
 });
}


function roomFor(a,b){
 return "private_"+[a,b].sort().join("_");

/* =========================================================

========================================================= */

async function signup(){

 const email=
 document.getElementById("signupEmail").value.trim();

 const password=
 document.getElementById("signupPassword").value;

 const username=
 document.getElementById("signupUsername").value.trim();

 const display=
 document.getElementById("signupDisplay").value.trim();

 if(!email||!password||!username){

   "Email, password and username required.");

 }

 const {data,error}=await sb.auth.signUp({
  email,
  password
 });

 if(error){
  showToast("Signup failed",error.message);
  return;
 }

 if(!data.user){
  showToast("Signup failed","User was not created.");
  return;
 }

 const user=data.user;

 const {error:profileError}=await sb
  .from("profiles")
  .update({
   username,
   display_name:display||username
  })
  .eq("id",user.id);

 if(profileError){

   "Profile issue",
   profileError.message
  );
 }

 if(data.session){

  currentUser=user;
  await enterApp();

 }else{

  showToast(
   "Account created",
   "Email confirmation required. Check your email."
  );

  showLogin();
 }
}

/* =========================================================
   REALTIME
========================================================= */

async function setupRealtime(){

 if(realtimeChannel){
  await sb.removeChannel(realtimeChannel);
 }

 realtimeChannel=sb
  .channel("shadow-chat-realtime-"+currentUser.id)

  .on(
   "postgres_changes",
   {
    event:"INSERT",
    schema:"public",
    table:"messages"
   },
   async payload=>{

    const m=payload.new;

    if(m.message_type!=="chat")return;

    if(m.room==="public"){

     if(currentRoom==="public"){
      await loadPublicMessages();
     }

     return;
    }


    const mine=m.sender_id===currentUser.id;

    if(
     currentRoom==="private" &&
     currentFriend &&
     m.room===roomFor(
      currentUser.id,
      currentFriend.id
     )
    ){
     await loadPrivateMessages(currentFriend.id);
    }


    if(
     m.receiver_id===currentUser.id &&
     !mine
    ){

     const sameChat=
      currentRoom==="private" &&
      currentFriend &&
      m.room===roomFor(
       currentUser.id,
       currentFriend.id
      );

     if(!sameChat){

      const p=await getProfile(m.sender_id);

      showToast(
       "New Message",
       (p?.display_name||"Someone")+
       ": "+m.message
      );

      try{
       if(
        "Notification" in window &&
        Notification.permission==="granted"
       ){
        new Notification(
         p?.display_name||"New Message",
         {body:m.message}
        );
       }
      }catch(e){}

     }
    }

   }
  )

  .on(
   "postgres_changes",
   {
    event:"UPDATE",
    schema:"public",
    table:"messages"
   },
   async payload=>{

    const m=payload.new;

    if(m.message_type!=="chat")return;

    if(
     currentRoom==="private" &&
     currentFriend &&
     m.room===roomFor(
      currentUser.id,
      currentFriend.id
     )
    ){
     await loadPrivateMessages(currentFriend.id);
    }

   }
  )

  .subscribe();


 if(
  "Notification" in window &&
  Notification.permission==="default"
 ){
  Notification.requestPermission().catch(()=>{});
 }
}


/* =========================================================
   VOICE ROOM
========================================================= */

/*
  IMPORTANT:
  Voice room is a realtime WebRTC room.
  User mic status is broadcast so everyone sees
  who is inside and who has mic ON.
*/

async function joinVoiceRoom(){

 if(voiceJoined)return;

 voiceJoined=true;
 voiceMuted=false;

 try{

  voiceStream=
   await navigator.mediaDevices.getUserMedia({
    audio:true,
    video:false
   });

 }catch(e){

  voiceJoined=false;

  showToast(
   "Microphone blocked",
   "Please allow microphone permission."
  );

  return;
 }


 voiceChannel=sb
  .channel("shadow-voice-room",{
   config:{
    broadcast:{
     self:false
    },
    presence:{
     key:currentUser.id
    }
   }
  })


  /* SIGNAL */

  .on(
   "broadcast",
   {event:"voice-signal"},
   async ({payload})=>{

    if(payload.to!==currentUser.id)return;

    await handleVoiceSignal(payload);
   }
  )


  /* PRESENCE */

  .on(
   "presence",
   {event:"sync"},
   ()=>{
    renderVoiceUsers();
   }
  )

  .on(
   "presence",
   {event:"join"},
   ()=>{
    renderVoiceUsers();
   }
  )

  .on(
   "presence",
   {event:"leave"},
   ()=>{
    renderVoiceUsers();
   }
  );


 await voiceChannel.subscribe(
  async status=>{

   if(status==="SUBSCRIBED"){

    await voiceChannel.track({
     id:currentUser.id,
     name:
      currentProfile?.display_name||
      currentProfile?.username||
      "User",
     muted:false
    });

    renderVoiceUsers();

    showToast(
     "Voice Room",
     "You joined the voice room."
    );
   }
  }
 );


 document.getElementById("joinVoiceBtn")
  .outerHTML=`
   <button
    id="joinVoiceBtn"
    class="leaveVoice"
    onclick="leaveVoiceRoom()">
    ❌ Leave Voice Room
   </button>
  `;

 document.getElementById("voiceStatus")
  .textContent="You are inside";
}


async function leaveVoiceRoom(){

 voiceJoined=false;

 if(voiceStream){
  voiceStream.getTracks().forEach(t=>t.stop());
  voiceStream=null;
 }

 for(const id in voicePeers){

  try{
   voicePeers[id].close();
  }catch(e){}
 }

 voicePeers={};

 if(voiceChannel){

  try{
   await voiceChannel.untrack();
  }catch(e){}

  await sb.removeChannel(voiceChannel);
  voiceChannel=null;
 }

 document.getElementById("joinVoiceBtn")
  .outerHTML=`
   <button
    id="joinVoiceBtn"
    class="joinVoice"
    onclick="joinVoiceRoom()">
    🎙️ Join Voice Room
   </button>
  `;

 document.getElementById("voiceStatus")
  .textContent="Offline";

 document.getElementById("voiceUsers").innerHTML=`
  <div style="color:#718096;font-size:12px">
   No one is in the voice room.
  </div>
 `;

 showToast("Voice Room","You left the room.");
}


/* =========================================================
   VOICE USERS
========================================================= */

function renderVoiceUsers(){

 if(!voiceChannel)return;

 const state=voiceChannel.presenceState();

 const users=[];

 Object.keys(state).forEach(key=>{

  const entries=state[key]||[];

  entries.forEach(item=>{

   users.push({
    id:item.id||key,
    name:item.name||"User",
    muted:item.muted
   });

  });
 });


 const box=document.getElementById("voiceUsers");

 if(!users.length){

  box.innerHTML=`
   <div style="color:#718096;font-size:12px">
    No one is in the voice room.
   </div>
  `;

  return;
 }


 box.innerHTML=users.map(u=>`

  <div class="voiceUser">

   <div class="avatar tiny">
    ${escapeHtml(initials(u.name))}
   </div>

   <div class="voiceUserName">
    ${escapeHtml(u.name)}

    ${
     u.id===currentUser.id
     ?` <span style="color:#168ce8">(You)</span>`
     :""
    }
   </div>

   <div class="micState">
    ${u.muted?"🔇":"🎙️"}
   </div>

  </div>

 `).join("");
}


/* =========================================================
   VOICE MIC TOGGLE
========================================================= */

async function toggleVoiceMic(){

 if(!voiceStream||!voiceJoined)return;

 const track=voiceStream.getAudioTracks()[0];

 if(!track)return;

 voiceMuted=!voiceMuted;

 track.enabled=!voiceMuted;


 if(voiceChannel){

  await voiceChannel.track({
   id:currentUser.id,
   name:
    currentProfile?.display_name||
    currentProfile?.username||
    "User",
   muted:voiceMuted
  });
 }

 showToast(
  "Voice Room",
  voiceMuted?"Microphone OFF":"Microphone ON"
 );
}


/* =========================================================
   VOICE WEBRTC SIGNAL
========================================================= */

async function createVoicePeer(remoteId,offerer){

 if(voicePeers[remoteId]){
  return voicePeers[remoteId];
 }

 const pc=new RTCPeerConnection({
  iceServers:[
   {urls:"stun:stun.l.google.com:19302"}
  ]
 });

 voicePeers[remoteId]=pc;


 if(voiceStream){

  voiceStream.getTracks().forEach(track=>{
   pc.addTrack(track,voiceStream);
  });

 }


 pc.onicecandidate=e=>{

  if(!e.candidate)return;

  voiceChannel.send({
   type:"broadcast",
   event:"voice-signal",
   payload:{
    from:currentUser.id,
    to:remoteId,
    type:"ice",
    candidate:e.candidate
   }
  });

 };


 pc.ontrack=e=>{

  let audio=
   document.getElementById(
    "voice-audio-"+remoteId
   );

  if(!audio){

   audio=document.createElement("audio");
   audio.id="voice-audio-"+remoteId;
   audio.autoplay=true;

   document.body.appendChild(audio);
  }

  audio.srcObject=e.streams[0];
 };


 if(offerer){

  const offer=await pc.createOffer();

  await pc.setLocalDescription(offer);

  voiceChannel.send({
   type:"broadcast",
   event:"voice-signal",
   payload:{
    from:currentUser.id,
    to:remoteId,
    type:"offer",
    offer
   }
  });

 }

 return pc;
}


async function handleVoiceSignal(p){

 if(!voiceJoined)return;


 if(p.type==="offer"){

  const pc=
   await createVoicePeer(p.from,false);

  await pc.setRemoteDescription(
   new RTCSessionDescription(p.offer)
  );

  const answer=
   await pc.createAnswer();

  await pc.setLocalDescription(answer);

  voiceChannel.send({
   type:"broadcast",
   event:"voice-signal",
   payload:{
    from:currentUser.id,
    to:p.from,
    type:"answer",
    answer
   }
  });

 }


 else if(p.type==="answer"){

  const pc=voicePeers[p.from];

  if(pc){

   await pc.setRemoteDescription(
    new RTCSessionDescription(p.answer)
   );
  }

 }


 else if(p.type==="ice"){

  const pc=voicePeers[p.from];

  if(pc){

   try{
    await pc.addIceCandidate(p.candidate);
   }catch(e){}
  }
 }
}


/* =========================================================
   CALL SIGNALING
========================================================= */

async function setupCallChannel(){

 if(callChannel){
  await sb.removeChannel(callChannel);
 }

 callChannel=sb
  .channel("private-call-"+currentUser.id)

  .on(
   "broadcast",
   {event:"call-signal"},
   async ({payload})=>{

    if(payload.to!==currentUser.id)return;

    await handleCallSignal(payload);
   }
  )

  .subscribe();
}


/* =========================================================
   PRIVATE CALL
========================================================= */

async function startPrivateCall(
 type,
 friendId=null
){

 if(!friendId){

  if(!currentFriend){
   showToast("Select a friend first");
   return;
  }

  friendId=currentFriend.id;
 }

 const friend=await getProfile(friendId);

 if(!friend)return;

 callFriend=friend;
 callType=type;


 try{

  callStream=
   await navigator.mediaDevices.getUserMedia({
    audio:true,
    video:type==="video"
   });

 }catch(e){

  showToast(
   "Permission denied",
   "Allow camera/microphone permission."
  );

  return;
 }


 document.getElementById("callTitle")
  .textContent=
  type==="video"
   ?"Video Call with "+(
    friend.display_name||friend.username
   )
   :"Voice Call with "+(
    friend.display_name||friend.username
   );


 document.getElementById("callModal")
  .classList.remove("hidden");


 const local=
  document.getElementById("localVideo");

 local.srcObject=callStream;

 local.classList.toggle(
  "hidden",
  type!=="video"
 );


 callPeer=new RTCPeerConnection({
  iceServers:[
   {urls:"stun:stun.l.google.com:19302"}
  ]
 });


 callStream.getTracks().forEach(track=>{
  callPeer.addTrack(track,callStream);
 });


 callPeer.ontrack=e=>{
  document.getElementById(
   "remoteVideo"
  ).srcObject=e.streams[0];
 };


 callPeer.onicecandidate=e=>{

  if(!e.candidate)return;

  sendCallSignal({
   to:friendId,
   from:currentUser.id,
   type:"ice",
   candidate:e.candidate
  });
 };


 const offer=await callPeer.createOffer();

 await callPeer.setLocalDescription(offer);

 sendCallSignal({
  to:friendId,
  from:currentUser.id,
  type:"offer",
  offer,
  callType:type
 });
}


function sendCallSignal(payload){

 if(!callChannel)return;

 callChannel.send({
  type:"broadcast",
  event:"call-signal",
  payload
 });
}


/* =========================================================
   INCOMING CALL
========================================================= */

async function handleCallSignal(p){

 if(p.type==="offer"){

  const caller=await getProfile(p.from);

  const accept=confirm(
   (caller?.display_name||caller?.username||"Someone")+
   " is calling you. Accept?"
  );

  if(!accept){

   sendCallSignal({
    to:p.from,
    from:currentUser.id,
    type:"decline"
   });

   return;
  }


  callFriend=caller;
  callType=p.callType||"voice";


  try{

   callStream=
    await navigator.mediaDevices.getUserMedia({
     audio:true,
     video:callType==="video"
    });

  }catch(e){

   showToast(
    "Permission denied",
    "Allow camera/microphone permission."
   );

   return;
  }


  document.getElementById("callTitle")
   .textContent=
   callType==="video"
    ?"Video Call"
    :"Voice Call";


  document.getElementById("callModal")
   .classList.remove("hidden");


  const local=
   document.getElementById("localVideo");

  local.srcObject=callStream;

  local.classList.toggle(
   "hidden",
   callType!=="video"
  );


  callPeer=new RTCPeerConnection({
   iceServers:[
    {urls:"stun:stun.l.google.com:19302"}
   ]
  });


  callStream.getTracks().forEach(track=>{
   callPeer.addTrack(track,callStream);
  });


  callPeer.ontrack=e=>{
   document.getElementById(
    "remoteVideo"
   ).srcObject=e.streams[0];
  };


  callPeer.onicecandidate=e=>{

   if(e.candidate){

    sendCallSignal({
     to:p.from,
     from:currentUser.id,
     type:"ice",
     candidate:e.candidate
    });

   }

  };


  await callPeer.setRemoteDescription(
   new RTCSessionDescription(p.offer)
  );


  const answer=
   await callPeer.createAnswer();

  await callPeer.setLocalDescription(answer);


  sendCallSignal({
   to:p.from,
   from:currentUser.id,
   type:"answer",
   answer
  });

 }


 else if(p.type==="answer"){

  if(callPeer){

   await callPeer.setRemoteDescription(
    new RTCSessionDescription(p.answer)
   );

  }

 }


 else if(p.type==="ice"){

  if(callPeer){

   try{
    await callPeer.addIceCandidate(p.candidate);
   }catch(e){}
  }

 }


 else if(p.type==="decline"){

  showToast(
   "Call declined"
  );

  endCall();
 }
}


/* =========================================================
   CALL CONTROLS
========================================================= */

function toggleCallMic(){

 if(!callStream)return;

 const track=
  callStream.getAudioTracks()[0];

 if(track){
  track.enabled=!track.enabled;
 }
}


function toggleCamera(){

 if(!callStream)return;

 const track=
  callStream.getVideoTracks()[0];

 if(track){
  track.enabled=!track.enabled;
 }
}


function endCall(){

 if(callStream){

  callStream
   .getTracks()
   .forEach(t=>t.stop());

  callStream=null;
 }

 if(callPeer){

  try{
   callPeer.close();
  }catch(e){}

  callPeer=null;
 }

 document.getElementById("remoteVideo")
  .srcObject=null;

 document.getElementById("localVideo")
  .srcObject=null;

 document.getElementById("callModal")
  .classList.add("hidden");

 callFriend=null;
 callType=null;
}

function mobileVoice(){

 panel.className="mobilePanel";

    <div class="voiceTitle">

function renderMobileVoiceUsers(){

 const box=
  document.getElementById("mobileVoiceUsers");

 if(!box||!voiceChannel)return;

 const state=
  voiceChannel.presenceState();

 const users=[];

 Object.keys(state).forEach(k=>{
  (state[k]||[]).forEach(x=>{
   users.push(x);
  });
 });

 box.innerHTML=users.map(u=>`

  <div class="voiceUser">

   <div class="avatar tiny">
    ${escapeHtml(initials(u.name))}
   </div>

   <div class="voiceUserName">
    ${escapeHtml(u.name)}
   </div>

   <div class="micState">
    ${u.muted?"🔇":"🎙️"}
   </div>

  </div>

 `).join("");
}


function mobileClosePanels(){

 document
  .getElementById("mobilePanel")
  ?.remove();
}


/* =========================================================
   MODAL
========================================================= */

function closeModal(){
 document
  .getElementById("modal")
  .classList.add("hidden");
}


/* =========================================================
   LOGOUT
========================================================= */

async function logout(){

 await leaveVoiceRoom().catch(()=>{});

 if(realtimeChannel){
  await sb.removeChannel(realtimeChannel);
  realtimeChannel=null;
 }

 if(callChannel){
  await sb.removeChannel(callChannel);
  callChannel=null;
 }

 await sb.auth.signOut();

 currentUser=null;
 currentProfile=null;
 currentFriend=null;
 friends=[];

 document.getElementById("app")
  .classList.add("hidden");

 document.getElementById("authScreen")
  .classList.remove("hidden");
}


/* =========================================================
   SESSION RESTORE
========================================================= */

async function init(){

 const {data}=await sb.auth.getSession();

 if(data?.session?.user){

  currentUser=data.session.user;

  await enterApp();

 }else{

  document
   .getElementById("authScreen")
   .classList.remove("hidden");

  document
   .getElementById("app")
   .classList.add("hidden");
 }
}


sb.auth.onAuthStateChange(
 async(event,session)=>{

  if(
   session?.user &&
   !currentUser
  ){

   currentUser=session.user;

   await enterApp();
  }

 }
);


/* =========================================================
   START
========================================================= */

init();

</script>
